<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IS101 — Unit 1 AI Exam</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --csn:#003876;--ai:#6d28d9;--ai-lt:#f5f3ff;--ai-bd:#c4b5fd;
  --ok:#15803d;--ok-lt:#f0fdf4;--ok-bd:#86efac;
  --err:#dc2626;--err-lt:#fef2f2;--err-bd:#fca5a5;
  --bg:#f0f2f5;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;
}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
#hdr{background:var(--csn);padding:0 24px;display:flex;align-items:center;gap:12px;height:50px;flex-shrink:0}
.hlogo{font-size:14px;font-weight:700;color:#fff}
.hlogo span{color:#93c5fd;font-size:11px;font-weight:400;margin-left:6px}

/* MAIN */
#main{flex:1;max-width:820px;margin:0 auto;padding:28px 24px;width:100%}

/* EXAM HEADER */
.exam-hero{background:linear-gradient(135deg,#4c1d95,#6d28d9);border-radius:12px;padding:22px 26px;margin-bottom:24px;color:#fff}
.eh-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#c4b5fd;margin-bottom:6px}
.eh-title{font-size:22px;font-weight:800;margin-bottom:6px}
.eh-sub{font-size:13px;color:rgba(255,255,255,.75);line-height:1.5}
.eh-meta{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap}
.eh-badge{background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;color:#fff}

/* PROGRESS BAR */
.progress-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:16px}
.prog-bar{flex:1;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#6d28d9,#a855f7);border-radius:4px;transition:width .3s}
.prog-lbl{font-size:12px;font-weight:700;color:var(--ai);white-space:nowrap}

/* QUESTION CARD */
.q-card{background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden;transition:border-color .2s}
.q-card.answered{border-color:var(--ai-bd)}
.q-card.correct{border-color:var(--ok-bd);background:var(--ok-lt)}
.q-card.incorrect{border-color:var(--err-bd);background:var(--err-lt)}
.q-hd{padding:14px 18px;display:flex;align-items:flex-start;gap:12px}
.q-num{width:28px;height:28px;border-radius:50%;background:var(--ai);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.q-card.correct .q-num{background:var(--ok)}
.q-card.incorrect .q-num{background:var(--err)}
.q-topic{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ai);margin-bottom:5px}
.q-card.correct .q-topic{color:var(--ok)}
.q-card.incorrect .q-topic{color:var(--err)}
.q-text{font-size:14px;font-weight:600;color:var(--text);line-height:1.5}
.q-options{padding:0 18px 14px 58px;display:flex;flex-direction:column;gap:6px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border-radius:7px;border:1px solid var(--border);cursor:pointer;transition:all .15s;background:#fff}
.q-opt:hover{border-color:var(--ai);background:var(--ai-lt)}
.q-opt input[type=radio]{width:15px;height:15px;accent-color:var(--ai);flex-shrink:0;margin-top:2px;cursor:pointer}
.q-opt label{font-size:13px;color:var(--text);cursor:pointer;line-height:1.4}
.q-opt.selected{border-color:var(--ai);background:var(--ai-lt)}
.q-opt.correct-ans{border-color:var(--ok-bd)!important;background:var(--ok-lt)!important}
.q-opt.wrong-ans{border-color:var(--err-bd)!important;background:var(--err-lt)!important}
.q-feedback{padding:8px 18px 14px 58px;font-size:12px;line-height:1.5;font-weight:500}
.q-feedback.ok{color:var(--ok)}
.q-feedback.bad{color:var(--err)}

/* SUBMIT AREA */
.submit-area{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.submit-note{font-size:13px;color:var(--muted);line-height:1.5}
.submit-btn{background:var(--ai);color:#fff;border:none;padding:11px 28px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .1s}
.submit-btn:hover{background:#5b21b6}
.submit-btn:disabled{background:#d8b4fe;cursor:not-allowed}

/* SCORE CARD */
.score-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px}
.score-hero{padding:28px;text-align:center}
.score-icon{font-size:52px;margin-bottom:12px}
.score-pct{font-size:52px;font-weight:900;line-height:1;margin-bottom:6px}
.score-pass{color:var(--ok)}
.score-fail{color:var(--err)}
.score-lbl{font-size:16px;font-weight:700;margin-bottom:6px}
.score-sub{font-size:13px;color:var(--muted)}
.score-breakdown{padding:18px 20px;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sb-item{text-align:center;padding:12px;background:#f8fafc;border-radius:8px}
.sb-num{font-size:22px;font-weight:800;color:var(--ai)}
.sb-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.score-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn-retake{background:#fff;border:2px solid var(--ai);color:var(--ai);padding:9px 22px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-retake:hover{background:var(--ai-lt)}
.btn-done{background:var(--ok);color:#fff;border:none;padding:9px 22px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-done:hover{background:#166534}
</style>
</head>
<body>
<div id="hdr">
  <div class="hlogo">IS101 <span>Unit 1 — Artificial Intelligence Exam</span></div>
</div>
<div id="main"></div>

<script>
var QUESTIONS = [
  {
    topic:'Topic 1 — What Is AI?',
    q:'What makes artificial intelligence fundamentally different from traditional software?',
    opts:[
      'AI runs faster and uses less memory than traditional software',
      'AI learns patterns from data to make predictions rather than following exact programmed rules',
      'AI requires a constant internet connection to function',
      'AI can only be used by large companies with expensive hardware'
    ],
    correct:1,
    explain:'Traditional software follows exact rules written by a programmer. AI — especially machine learning — learns from training data to recognize patterns and make predictions, without being explicitly programmed for every situation.'
  },
  {
    topic:'Topic 1 — What Is AI?',
    q:'Which of the following BEST describes how machine learning works?',
    opts:[
      'A programmer writes a rule for every possible situation the computer might encounter',
      'The computer randomly generates answers and checks if they are correct',
      'The system finds patterns in large amounts of training data and uses those patterns to make predictions',
      'The computer memorizes a database of correct answers and looks them up when asked'
    ],
    correct:2,
    explain:'Machine learning works by exposing a system to large amounts of training data. The system identifies patterns in that data and uses those patterns to make predictions on new inputs it has never seen before.'
  },
  {
    topic:'Topic 1 — What Is AI?',
    q:'A spam filter that blocks unwanted email is an example of:',
    opts:[
      'General AI — because it can learn to do many tasks',
      'Narrow AI — because it is designed to do one specific task',
      'General AI — because it uses advanced machine learning',
      'Neither AI nor machine learning — it just follows rules'
    ],
    correct:1,
    explain:'A spam filter is narrow AI — it is trained specifically to classify email as spam or not spam. All AI that exists today is narrow AI. General AI, which could do anything a human can do, does not yet exist.'
  },
  {
    topic:'Topic 2 — Working With AI Tools',
    q:'What is the KEY difference between Google NotebookLM and ChatGPT?',
    opts:[
      'NotebookLM is free while ChatGPT always requires a paid subscription',
      'ChatGPT can browse the internet in real time while NotebookLM cannot',
      'NotebookLM answers questions based only on sources you upload, while ChatGPT draws from broad general training data',
      'ChatGPT is more accurate than NotebookLM for all tasks'
    ],
    correct:2,
    explain:'NotebookLM is source-grounded — it only uses documents you upload. This makes it safer for academic work because it cites specific passages and cannot hallucinate information outside your sources. ChatGPT draws from broad training data and can be used for any topic but may hallucinate.'
  },
  {
    topic:'Topic 2 — Working With AI Tools',
    q:'Which prompt would produce the MOST useful AI response?',
    opts:[
      '"Tell me about climate change"',
      '"Climate change"',
      '"Summarize the three main causes of climate change in 4 bullet points written for a college student who has not studied science"',
      '"What is climate change? Give me a long detailed response"'
    ],
    correct:2,
    explain:'The best prompt includes context (who the audience is), a specific format (4 bullet points), a specific task (summarize the three main causes), and a constraint (for a college student without a science background). Vague prompts produce vague responses.'
  },
  {
    topic:'Topic 2 — Working With AI Tools',
    q:'For which task would Google NotebookLM be MORE useful than ChatGPT?',
    opts:[
      'Brainstorming creative ideas for a fictional story',
      'Writing a first draft of an essay on a general topic you know nothing about',
      'Answering questions about a specific PDF article your professor assigned for class',
      'Generating a poem in the style of Shakespeare'
    ],
    correct:2,
    explain:'NotebookLM excels when you have a specific source document and want to ask questions about it. Because it only uses your uploaded sources, it will cite the exact passage and cannot make things up outside that document — making it ideal for academic reading and study.'
  },
  {
    topic:'Topic 2 — Working With AI Tools',
    q:'What does it mean to "iterate" on a prompt when using AI?',
    opts:[
      'Copy and paste the same prompt into multiple different AI tools at the same time',
      'Refine and improve your prompt based on the AI\'s response to get better results',
      'Delete the prompt and start completely over with a new topic',
      'Repeat the exact same prompt several times until you get a different answer'
    ],
    correct:1,
    explain:'Iterating on a prompt means reviewing what the AI produced, identifying what was missing or unclear, and writing a follow-up prompt that asks for improvements. It is a core skill of effective AI use — rarely does a first prompt produce the best result.'
  },
  {
    topic:'Topic 3 — Ethics & Limitations',
    q:'What is an AI "hallucination"?',
    opts:[
      'When an AI generates surreal or dreamlike images',
      'When an AI takes too long to respond and the screen flickers',
      'When an AI confidently states false or made-up information as if it were completely true',
      'When an AI refuses to answer a question because it is too sensitive'
    ],
    correct:2,
    explain:'An AI hallucination occurs when an AI system generates information that sounds confident and plausible but is factually wrong or completely made up. This happens because AI generates text based on patterns, not because it actually knows facts. Always verify important AI-generated claims.'
  },
  {
    topic:'Topic 3 — Ethics & Limitations',
    q:'A company trains an AI hiring tool using 10 years of past hiring data. Historically, most people hired were men. What is the most likely result?',
    opts:[
      'The AI will hire more women to correct the historical imbalance',
      'The AI may unfairly downrank qualified women\'s applications because it learned that men were the "right" hire',
      'The AI will ignore gender entirely since it is just a computer program',
      'The AI will detect the bias in the data and automatically correct it'
    ],
    correct:1,
    explain:'AI learns patterns from its training data. If the data reflects historical bias — in this case, that men were hired more — the AI will learn to replicate that bias. It does not automatically detect or correct unfairness. This is why training data must be carefully examined before deploying AI in high-stakes decisions.'
  },
  {
    topic:'Topic 3 — Ethics & Limitations',
    q:'According to an ethical AI decision framework, which situation is the LEAST appropriate use of AI?',
    opts:[
      'Using AI to brainstorm ideas for a creative project',
      'Using AI to generate a first draft of a cover letter that you will edit yourself',
      'Using AI to get a medical diagnosis and acting on that diagnosis without consulting a doctor',
      'Using AI to summarize a long research article to understand it more quickly'
    ],
    correct:2,
    explain:'Medical diagnosis is a high-stakes situation where an AI error could directly cause harm. The AI decision framework asks: Could being wrong cause serious harm? In medical decisions, the answer is yes. AI tools should support informed decisions, not replace professional medical judgment.'
  }
];

var S = { answers: {}, submitted: false };

function loadSaved(){
  try {
    var d = localStorage.getItem('is101-ai-exam');
    if(d){ var p=JSON.parse(d); S.answers=p.answers||{}; S.submitted=p.submitted||false; }
  } catch(e){}
}

function save(){
  try { localStorage.setItem('is101-ai-exam', JSON.stringify(S)); } catch(e){}
}

function score(){
  var correct=0;
  QUESTIONS.forEach(function(q,i){ if(S.answers[i]===q.correct) correct++; });
  return correct;
}

function answeredCount(){
  return Object.keys(S.answers).length;
}

function render(){
  if(S.submitted){ renderResults(); return; }
  renderExam();
}

function renderExam(){
  var answered = answeredCount();
  var pct = Math.round(answered/QUESTIONS.length*100);

  var html = '';

  html += '<div class="exam-hero">'
    + '<div class="eh-tag">Unit 1 \u2014 Artificial Intelligence</div>'
    + '<div class="eh-title">Unit Knowledge Check</div>'
    + '<div class="eh-sub">Answer all 10 questions to test your understanding of AI concepts, tools, and ethics. You may attempt this exam as many times as you need.</div>'
    + '<div class="eh-meta">'
    + '<div class="eh-badge">&#x1F4DD; 10 Questions</div>'
    + '<div class="eh-badge">&#x267E; Unlimited Attempts</div>'
    + '<div class="eh-badge">&#x2714; Must Score 100%</div>'
    + '</div></div>';

  html += '<div class="progress-wrap">'
    + '<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div>'
    + '<div class="prog-lbl">'+answered+'/'+QUESTIONS.length+' answered</div>'
    + '</div>';

  QUESTIONS.forEach(function(q,i){
    var sel = S.answers[i];
    var isAnswered = sel !== undefined;
    html += '<div class="q-card'+(isAnswered?' answered':'')+'" id="q'+i+'">'
      + '<div class="q-hd">'
      + '<div class="q-num">'+(i+1)+'</div>'
      + '<div><div class="q-topic">'+q.topic+'</div>'
      + '<div class="q-text">'+q.q+'</div></div>'
      + '</div>'
      + '<div class="q-options">';
    q.opts.forEach(function(opt,j){
      var isSel = sel===j;
      html += '<div class="q-opt'+(isSel?' selected':'')+'" onclick="pick('+i+','+j+')">'
        + '<input type="radio" name="q'+i+'" id="q'+i+'o'+j+'" '+(isSel?'checked':'')+'>'
        + '<label for="q'+i+'o'+j+'">'+opt+'</label>'
        + '</div>';
    });
    html += '</div></div>';
  });

  var allDone = answered === QUESTIONS.length;
  html += '<div class="submit-area">'
    + '<div class="submit-note">'+(allDone?'All questions answered \u2014 click Submit when ready.':'Answer all '+QUESTIONS.length+' questions to submit.')+'</div>'
    + '<button class="submit-btn" '+(allDone?'':'disabled')+' onclick="submit()">Submit Exam &#8594;</button>'
    + '</div>';

  document.getElementById('main').innerHTML = html;
}

function renderResults(){
  var correct = score();
  var total = QUESTIONS.length;
  var pct = Math.round(correct/total*100);
  var passed = pct === 100;

  var html = '';

  html += '<div class="score-card">'
    + '<div class="score-hero">'
    + '<div class="score-icon">'+(passed?'\u2705':'\uD83D\uDCDA')+'</div>'
    + '<div class="score-pct '+(passed?'score-pass':'score-fail')+'">'+pct+'%</div>'
    + '<div class="score-lbl '+(passed?'score-pass':'score-fail')+'">'+(passed?'Excellent! You passed!':'Not quite \u2014 review and try again')+'</div>'
    + '<div class="score-sub">'+correct+' of '+total+' questions correct'+(passed?' \u2014 Step 3 is now complete!':' \u2014 You need 100% to pass. Review the explanations below and retake when ready.')+'</div>'
    + '</div>'
    + '<div class="score-breakdown">'
    + '<div class="sb-item"><div class="sb-num">'+correct+'</div><div class="sb-lbl">Correct</div></div>'
    + '<div class="sb-item"><div class="sb-num">'+(total-correct)+'</div><div class="sb-lbl">Incorrect</div></div>'
    + '<div class="sb-item"><div class="sb-num">'+total+'</div><div class="sb-lbl">Total</div></div>'
    + '</div>'
    + '<div class="score-footer">'
    + '<button class="btn-retake" onclick="retake()">&#8635; Retake Exam</button>'
    + (passed?'<button class="btn-done" onclick="markDone()">&#10003; Mark Complete &amp; Close</button>':'')
    + '</div></div>';

  // Show all questions with correct/incorrect highlighted
  QUESTIONS.forEach(function(q,i){
    var sel = S.answers[i];
    var isCorrect = sel===q.correct;
    html += '<div class="q-card '+(isCorrect?'correct':'incorrect')+'">'
      + '<div class="q-hd">'
      + '<div class="q-num">'+(isCorrect?'\u2713':'&#x2717;')+'</div>'
      + '<div><div class="q-topic">'+q.topic+'</div>'
      + '<div class="q-text">'+q.q+'</div></div>'
      + '</div>'
      + '<div class="q-options">';
    q.opts.forEach(function(opt,j){
      var cls = '';
      if(j===q.correct) cls='correct-ans';
      else if(j===sel && sel!==q.correct) cls='wrong-ans';
      html += '<div class="q-opt '+cls+'">'
        + '<input type="radio" '+(j===sel?'checked':'')+' disabled>'
        + '<label>'+opt+'</label>'
        + '</div>';
    });
    html += '</div>'
      + '<div class="q-feedback '+(isCorrect?'ok':'bad')+'">'
      + (isCorrect?'\u2705 Correct! ':'&#x274C; Incorrect. ')
      + q.explain
      + '</div></div>';
  });

  document.getElementById('main').innerHTML = html;

  if(passed){
    try { window.parent.postMessage({type:'stepDone',exam:'ai-exam'},'*'); } catch(e){}
  }
}

function pick(qIdx, optIdx){
  if(S.submitted) return;
  S.answers[qIdx] = optIdx;
  save();
  // Update just the card without full re-render for speed
  render();
}

function submit(){
  if(answeredCount()<QUESTIONS.length) return;
  S.submitted = true;
  save();
  render();
}

function retake(){
  S.answers = {};
  S.submitted = false;
  save();
  render();
}

function markDone(){
  try { window.parent.postMessage({type:'stepDone',exam:'ai-exam'},'*'); } catch(e){}
  alert('Unit 1 AI exam complete! Return to the Start Here page and click Mark Complete to unlock your next steps.');
}

loadSaved();
render();
</script>
</body>
</html>
