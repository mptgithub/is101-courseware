<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Excel — IS101 Training</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;color:#1f1f1f;background:#fff}

/* ════ TITLE BAR — Excel green ════ */
#title-bar{height:32px;background:#217346;display:flex;align-items:center;padding:0 6px 0 8px;flex-shrink:0}
.qat{display:flex;gap:2px;margin-right:8px}
.qat button{width:24px;height:24px;background:transparent;border:none;color:rgba(255,255,255,.9);font-size:12px;cursor:pointer;border-radius:2px}
.qat button:hover{background:rgba(255,255,255,.15)}
.docname{flex:1;text-align:center;color:#fff;font-size:12px}
.winbtns{display:flex}
.winbtns button{width:44px;height:32px;background:transparent;border:none;color:rgba(255,255,255,.9);font-size:10px;cursor:pointer}
.winbtns button:hover{background:rgba(255,255,255,.18)}
.winbtns .cls:hover{background:#c42b1c}

/* ════ RIBBON SHELL — Excel green ════ */
#ribbon{background:#fff;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.18)}
#tab-strip{background:#217346;display:flex;align-items:flex-end;padding:0 2px;height:30px}
.tab{height:26px;padding:0 12px;font-size:12px;font-family:inherit;color:rgba(255,255,255,.85);background:transparent;border:none;cursor:pointer;white-space:nowrap;border-radius:2px 2px 0 0;position:relative;bottom:-1px;transition:color .1s}
.tab:hover{color:#fff;background:rgba(255,255,255,.12)}
.tab.active{background:#fff;color:#000;font-weight:400;border-left:1px solid #c8c8c8;border-right:1px solid #c8c8c8;border-top:2px solid #217346;border-bottom:none;height:30px;bottom:-1px;z-index:2}
.ctx-wrap{display:flex;flex-direction:column;align-items:flex-end}
.ctx-lbl{font-size:9px;color:#fbbf24;font-weight:600;padding:0 10px 1px;letter-spacing:.3px}
.tab.ctx{color:#fbbf24}
.tab.ctx.active{color:#92400e;border-top-color:#f59e0b}

/* ════ RIBBON BODY ════ */
#ribbon-body{background:#fff;border-top:1px solid #c8c8c8;display:flex;align-items:stretch;height:88px;overflow-x:auto;overflow-y:hidden;padding:0 2px}
.grp{display:flex;flex-direction:column;border-right:1px solid #e0e0e0;padding:0 2px;flex-shrink:0}
.grp:last-child{border-right:none}
.grp-btns{display:flex;align-items:flex-start;gap:1px;flex:1;padding:3px 2px 2px}
.grp-lbl{font-size:9px;color:#666;text-align:center;padding:1px 4px 2px;white-space:nowrap;display:flex;align-items:center;justify-content:center;min-height:13px}
.grp-lbl button{width:11px;height:11px;border:1px solid #c0c0c0;border-radius:1px;background:transparent;cursor:pointer;color:#777;font-size:7px;display:flex;align-items:center;justify-content:center;margin-left:3px;line-height:1}
.grp-lbl button:hover{background:#e0f0e8;border-color:#217346;color:#217346}

/* ════ LARGE BUTTON — icon above, label below ════ */
.lb{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;height:68px;min-width:42px;padding:4px 4px 2px;background:transparent;border:1px solid transparent;border-radius:2px;cursor:pointer;flex-shrink:0;transition:background .08s,border-color .08s;font-family:inherit}
.lb:hover{background:#e0f0e8;border-color:#a8d5bb}
.lb:active{background:#c5e8d1}
.lb.hl{background:#fff3cd;border-color:#f59e0b;animation:hlpulse 1.4s infinite}
.lb .li{display:flex;align-items:center;justify-content:center;width:32px;height:32px;font-size:21px;flex-shrink:0;margin-bottom:1px}
.lb .ll{font-size:9px;color:#333;text-align:center;line-height:1.25;white-space:normal;word-break:break-word;max-width:52px}

/* ════ DROPDOWN WRAPPER ════ */
.dd-wrap{position:relative;display:inline-flex;vertical-align:top}
.dd-menu{position:fixed;top:0;left:0;background:#fff;border:1px solid #ababab;box-shadow:0 4px 12px rgba(0,0,0,.18);z-index:500;min-width:180px;padding:2px 0;display:none}
.dd-menu.open{display:block}
.dd-item{display:block;width:100%;background:transparent;border:none;text-align:left;padding:6px 14px;font-size:12px;cursor:pointer;color:#1f1f1f;font-family:inherit}
.dd-item:hover{background:#e0f0e8}
.dd-sep{height:1px;background:#e5e7eb;margin:2px 0}

/* ════ SMALL BUTTON — icon left, label right ════ */
.sb{display:flex;align-items:center;gap:4px;height:20px;padding:0 6px;background:transparent;border:1px solid transparent;border-radius:2px;cursor:pointer;font-size:11px;font-family:inherit;color:#1f1f1f;white-space:nowrap;min-width:68px;transition:background .08s}
.sb:hover{background:#e0f0e8;border-color:#a8d5bb}
.sb.hl{background:#fff3cd;border-color:#f59e0b;animation:hlpulse 1.4s infinite}
.sb .si{font-size:13px;width:14px;text-align:center;flex-shrink:0}
.sb .sl{font-size:11px;color:#1f1f1f}
.sb-stack{display:flex;flex-direction:column;gap:1px;justify-content:center;height:68px}

/* ════ ICON-ONLY BUTTON (Alignment, Number groups) ════ */
.ib{width:24px;height:20px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:2px;cursor:pointer;color:#1f1f1f;flex-shrink:0;font-size:13px}
.ib:hover{background:#e0f0e8;border-color:#a8d5bb}
.ib.hl{background:#fff3cd;border-color:#f59e0b;animation:hlpulse 1.4s infinite}
.ib-sep{width:1px;height:14px;background:#d0d0d0;margin:0 1px;flex-shrink:0;align-self:center}
.ib-dd{position:relative;display:inline-flex}
.ib-dd-btn{width:28px;height:20px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:2px;cursor:pointer;font-size:10px;color:#1f1f1f;gap:1px;flex-shrink:0}
.ib-dd-btn:hover{background:#e0f0e8;border-color:#a8d5bb}
.ib-dd-btn.hl{background:#fff3cd;border-color:#f59e0b}
.two-rows{display:flex;flex-direction:column;gap:2px;padding-top:3px}
.icon-row{display:flex;align-items:center;gap:1px}

/* ════ NUMBER GROUP SPECIFIC ════ */
.num-fmt-dd{height:20px;border:1px solid #ababab;border-radius:2px;background:#fff;display:flex;align-items:center;padding:0 5px;gap:3px;cursor:pointer;font-size:11px;color:#1f1f1f;margin-bottom:2px}
.num-fmt-dd:hover{border-color:#555}
.num-fmt-dd .fa{font-size:7px;color:#777;margin-left:auto}
.num-wide-btn{height:20px;padding:0 6px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:2px;cursor:pointer;font-size:11px;font-weight:600;color:#1f1f1f;min-width:24px;font-family:inherit}
.num-wide-btn:hover{background:#e0f0e8;border-color:#a8d5bb}
.num-wide-btn.hl{background:#fff3cd;border-color:#f59e0b}

/* ════ FONT GROUP ════ */
.font-rows{display:flex;flex-direction:column;gap:2px;padding-top:3px}
.font-row{display:flex;align-items:center;gap:1px}
.font-combo{height:20px;border:1px solid #ababab;border-radius:2px;background:#fff;font-size:11px;font-family:inherit;padding:0 3px;color:#1f1f1f;display:flex;align-items:center;gap:2px;cursor:text}
.font-combo:hover{border-color:#555}
.font-combo .fa{font-size:7px;color:#777;flex-shrink:0}
.font-sq{width:22px;height:20px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:2px;cursor:pointer;font-size:12px;color:#1f1f1f;flex-shrink:0}
.font-sq:hover{background:#e0f0e8;border-color:#a8d5bb}
.font-sq.hl{background:#fff3cd;border-color:#f59e0b;animation:hlpulse 1.4s infinite}
.font-sep{width:1px;height:14px;background:#d0d0d0;margin:0 1px;flex-shrink:0}

/* ════ FORMULA BAR ════ */
#fbar-wrap{background:#fff;border-bottom:1px solid #c8c8c8;display:flex;align-items:center;height:24px;flex-shrink:0}
#name-box{width:68px;height:100%;border-right:1px solid #c8c8c8;padding:0 6px;font-size:12px;font-family:"Segoe UI",sans-serif;display:flex;align-items:center;cursor:default;flex-shrink:0;background:#fff}
#fbar-btns{display:flex;align-items:center;padding:0 4px;gap:2px;flex-shrink:0}
#fbar-btns button{background:transparent;border:none;cursor:pointer;font-size:13px;color:#555;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:2px}
#fbar-btns button:hover{background:#e0f0e8}
#fbar-fx{font-size:12px;color:#555;font-style:italic;padding:0 4px;flex-shrink:0}
#fbar-sep{width:1px;height:16px;background:#c8c8c8;flex-shrink:0}
#fbar-input{flex:1;height:100%;border:none;outline:none;padding:0 6px;font-size:12px;font-family:"Consolas","Courier New",monospace;color:#1f1f1f;background:#fff}
#fbar-input::placeholder{color:#aaa;font-family:"Segoe UI",sans-serif;font-style:italic;font-size:11px}

/* ════ BODY ════ */
#body-wrap{display:flex;flex:1;overflow:hidden}

/* Sidebar */
#sidebar{width:188px;background:#1e293b;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-hd{padding:14px 14px 10px;border-bottom:1px solid #334155}
.sb-exam{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#64748b;margin-bottom:2px}
.sb-title{font-size:14px;font-weight:700;color:#f1f5f9}
.sb-score-box{padding:10px 14px;border-bottom:1px solid #334155}
.sb-lbl{font-size:9px;color:#64748b;margin-bottom:3px}
.sb-val{font-size:22px;font-weight:700;color:#60a5fa}
.sb-bar{height:3px;background:#334155;border-radius:2px;margin-top:5px}
.sb-fill{height:100%;background:#217346;border-radius:2px;transition:width .4s}
.sb-domain{padding:8px 14px 3px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#475569}
.lab-btn{display:flex;align-items:center;gap:7px;width:100%;background:transparent;border:none;border-left:3px solid transparent;cursor:pointer;padding:7px 12px;text-align:left;color:#94a3b8;font-family:inherit;transition:all .15s}
.lab-btn:hover{background:#273244;color:#e2e8f0}
.lab-btn.active{background:#163a22;border-left-color:#217346;color:#fff}
.lab-btn.done{color:#34d399;border-left-color:#10b981}
.lab-dot{width:20px;height:20px;border-radius:50%;background:#334155;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;color:#94a3b8}
.lab-dot.active{background:#217346;color:#fff}
.lab-dot.done{background:#10b981;color:#fff}
.lab-name{font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab-obj{font-size:9px;opacity:.6;margin-top:1px}

/* ════ MAIN PANE ════ */
#main-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#fff}

/* Row/col headers + sheet area */
#sheet-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#fff}

/* Column headers */
#col-headers{display:flex;background:#f2f2f2;border-bottom:1px solid #c8c8c8;flex-shrink:0;overflow:hidden}
.row-num-spacer{width:42px;height:20px;border-right:1px solid #c8c8c8;flex-shrink:0;background:#f2f2f2}
.col-hdr{height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#555;border-right:1px solid #d9d9d9;flex-shrink:0;user-select:none}
.col-hdr.active-col{background:#217346;color:#fff;font-weight:600}
.col-hdr.has-data{background:#e0ece6}

/* Sheet cells */
#sheet-body{flex:1;overflow:auto;background:#fff}
#sheet-body table{border-collapse:collapse;font-family:"Calibri","Segoe UI",sans-serif;font-size:12px}
.row-num{width:42px;height:20px;background:#f2f2f2;border-right:1px solid #c8c8c8;border-bottom:1px solid #d9d9d9;text-align:center;font-size:11px;color:#555;cursor:default;user-select:none;flex-shrink:0}
.row-num.active-row{background:#217346;color:#fff;font-weight:600}
.cell{min-width:90px;height:20px;border-right:1px solid #d9d9d9;border-bottom:1px solid #d9d9d9;padding:0 4px;cursor:default;white-space:nowrap;overflow:hidden;background:#fff;position:relative}
.cell.header-cell{background:#f2f2f2;font-weight:600;text-align:center;color:#1f1f1f}
.cell.num-cell{text-align:right}
.cell.target-cell{background:#fff2cc;border:2px solid #217346}
.cell.target-cell.correct{background:#e2f0e8;border-color:#217346}
.cell.target-cell.wrong{background:#fce8e8;border-color:#c00}
.cell.selected{background:#d9e8f0;border:1px solid #5d9dc5}
.cell.result-cell{color:#217346;font-weight:600}
.cell.error-cell{color:#c00}

/* Sheet tabs at bottom */
#sheet-tabs{height:26px;background:#f2f2f2;border-top:1px solid #c8c8c8;display:flex;align-items:flex-end;padding:0 4px;flex-shrink:0}
.sheet-tab{height:22px;padding:0 14px;font-size:11px;color:#1f1f1f;background:#fff;border:1px solid #c8c8c8;border-bottom:none;cursor:pointer;font-family:inherit;border-radius:2px 2px 0 0;margin-right:2px}
.sheet-tab.active{border-bottom:1px solid #fff;color:#217346;font-weight:500}
#new-sheet-btn{width:22px;height:22px;background:transparent;border:1px solid transparent;border-radius:2px;cursor:pointer;color:#555;font-size:16px;display:flex;align-items:center;justify-content:center}
#new-sheet-btn:hover{background:#e0ece6}

/* Progress */
#prog-bar{height:3px;background:#e5e7eb;flex-shrink:0}
#prog-fill{height:100%;background:#217346;transition:width .4s}

/* Status bar */
#status-bar{height:22px;background:#217346;display:flex;align-items:center;padding:0 12px;color:rgba(255,255,255,.88);font-size:11px;flex-shrink:0;gap:16px}

/* Task panel */
#task-panel{background:#fff;border-top:2px solid #217346;padding:10px 16px;flex-shrink:0}
.task-row{display:flex;align-items:flex-start;gap:10px}
.task-badge{background:#217346;color:#fff;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:3px 8px;border-radius:2px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.task-text{font-size:13px;color:#14532d;font-weight:500;line-height:1.4;flex:1}
.task-acts{display:flex;gap:6px;flex-shrink:0}
.btn{padding:5px 14px;border-radius:2px;font-size:12px;cursor:pointer;font-family:inherit;border:1px solid transparent}
.btn-green{background:#217346;color:#fff}.btn-green:hover{background:#185c37}
.btn-ghost{background:#fff;border-color:#ababab;color:#374151}.btn-ghost:hover{background:#f5f5f5}
.hint-area{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.hint-row{padding:7px 12px;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;font-size:12px;color:#78350f;display:flex;align-items:flex-start;gap:6px;line-height:1.5}
.hint-row-0{background:#fff8e1;border-color:#fde68a}
.hint-row-1{background:#fff3cd;border-color:#fbbf24}
.hint-row-2{background:#fef3c7;border-color:#f59e0b}
.hint-answer{background:#f0fdf4;border-color:#86efac;color:#15803d}
.hint-num{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0;padding:1px 7px;border-radius:10px;background:rgba(0,0,0,.08);margin-top:1px}
.answer-tag{background:#15803d;color:#fff}
.fb{margin-top:7px;padding:9px 14px;font-size:12px;line-height:1.5}
.fb-ok{background:#f0fdf4;border:1px solid #86efac;color:#166534}
.fb-err{background:#fff1f1;border:1px solid #fca5a5;color:#991b1b}
.fb-next{display:flex;justify-content:flex-end;gap:8px;margin-top:7px}

/* backdrop + dialog */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:299;display:none}
.w-dlg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid #ababab;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:300;width:360px;display:none;font-family:"Segoe UI",sans-serif}
.dlg-hd{background:#217346;color:#fff;padding:8px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.dlg-close{background:transparent;border:none;color:#fff;cursor:pointer;font-size:16px;padding:0 4px}
.dlg-body{padding:16px}
.dlg-body label{display:block;font-size:12px;color:#374151;margin-bottom:3px;margin-top:10px}
.dlg-body label:first-child{margin-top:0}
.dlg-body input{width:100%;padding:5px 9px;border:1px solid #ababab;font-size:13px;font-family:inherit}
.dlg-body input:focus{outline:none;border-color:#217346}
.dlg-ft{padding:10px 16px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:8px;background:#f9f9f9}

@keyframes hlpulse{0%,100%{box-shadow:0 0 0 0 rgba(33,115,70,.4)}60%{box-shadow:0 0 0 4px rgba(33,115,70,.08)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1}}
</style>
</head>
<body>

<!-- Find Function dialog -->
<div class="backdrop" id="backdrop" onclick="closeDlg()"></div>
<div class="w-dlg" id="dlg">
  <div class="dlg-hd">Insert Function <button class="dlg-close" onclick="closeDlg()">✕</button></div>
  <div class="dlg-body">
    <label>Search for a function:</label>
    <input id="dlg-fn" placeholder="e.g. SUM, VLOOKUP, IF…">
    <label>Or select a category: All</label>
    <input id="dlg-cat" value="All" readonly>
  </div>
  <div class="dlg-ft">
    <button class="btn btn-ghost" onclick="closeDlg()">Cancel</button>
    <button class="btn btn-green" onclick="doInsertFn()">OK</button>
  </div>
</div>

<!-- TITLE BAR -->
<div id="title-bar">
  <div class="qat">
    <button title="Save">💾</button>
    <button title="Undo" style="font-size:11px">↩</button>
    <button title="Redo" style="font-size:11px">↪</button>
  </div>
  <div class="docname" id="doc-title">Book1.xlsx — Excel</div>
  <div class="winbtns">
    <button>─</button><button>❐</button><button class="cls">✕</button>
  </div>
</div>

<!-- RIBBON -->
<div id="ribbon">
  <div id="tab-strip"></div>
  <div id="ribbon-body"></div>
</div>

<!-- FORMULA BAR -->
<div id="fbar-wrap">
  <div id="name-box" id="name-box-el"></div>
  <div id="fbar-btns">
    <button title="Cancel (Esc)">✕</button>
    <button title="Enter">✔</button>
  </div>
  <div id="fbar-fx">fx</div>
  <div id="fbar-sep"></div>
  <input id="fbar-input" type="text" placeholder="Click the highlighted cell, type your formula, then press Enter">
</div>

<!-- PROGRESS -->
<div id="prog-bar"><div id="prog-fill" style="width:0%"></div></div>

<!-- BODY -->
<div id="body-wrap">
  <div id="sidebar">
    <div class="sb-hd"><div class="sb-exam">IS101 Associate</div><div class="sb-title">Excel Training</div></div>
    <div class="sb-score-box">
      <div class="sb-lbl">SCORE</div>
      <div class="sb-val" id="sb-score">0 / 100</div>
      <div class="sb-bar"><div class="sb-fill" id="sb-fill" style="width:0%"></div></div>
    </div>
    <div id="sb-nav"></div>
  </div>
  <div id="main-pane">
    <div id="sheet-wrap">
      <div id="col-headers"></div>
      <div id="sheet-body"></div>
      <div id="sheet-tabs">
        <button class="sheet-tab active">Sheet1</button>
        <button class="sheet-tab">Sheet2</button>
        <button id="new-sheet-btn" title="New Sheet">+</button>
      </div>
    </div>
    <div id="status-bar">
      <span id="st-mode">Ready</span>
      <span style="margin-left:auto;display:flex;gap:16px">
        <span id="st-avg"></span>
        <span id="st-cnt"></span>
        <span id="st-sum"></span>
        <span>🔲 🔲 🔲  100%</span>
      </span>
    </div>
    <div id="task-panel"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// LAB DATA — 10 formula labs (IS101)
// ═══════════════════════════════════════════
const DOMAINS=[
  {label:'D4 · Formulas ()',labs:[0,1,2,3,4]},
  {label:'D4 · Functions ()',labs:[5,6,7,8,9]},
];
const LABS=[
  {id:0,name:'SUM',domain:'D4',obj:'',tab:'formulas',action:'formula',
   cols:['A','B'],rows:7,
   cells:{A1:'Month',B1:'Sales ($)',A2:'January',B2:2400,A3:'February',B3:3100,A4:'March',B4:2850,A5:'April',B5:3200,A6:'May',B6:2750,A7:'TOTAL',B7:null},
   target:'B7',colWidths:{A:110,B:90},
   scenario:'Calculate total monthly sales using SUM.',
   task:'The monthly sales figures are in cells B2 through B6. Calculate the <strong>total sales</strong> for all months and display the result in cell <strong>B7</strong>.',
   hints:[

// FORMULA EVALUATOR
// ═══════════════════════════════════════════
function expandRange(ref,cells){
  const m=ref.match(/^([A-Z])(\d+):([A-Z])(\d+)$/i);
  if(!m)return[cells[ref.toUpperCase()]??null];
  const[,sc,sr,ec,er]=m,res=[];
  for(let c=sc.toUpperCase().charCodeAt(0);c<=ec.toUpperCase().charCodeAt(0);c++)
    for(let r=+sr;r<=+er;r++)res.push(cells[String.fromCharCode(c)+r]??null);
  return res;
}
function toNum(v){return typeof v==='number'?v:(parseFloat(v)||0);}
function splitArgs(s){const a=[];let d=0,c='';for(const ch of s){if(ch==='(')d++;else if(ch===')')d--;if(ch===','&&d===0){a.push(c);c='';}else c+=ch;}if(c)a.push(c);return a;}
function parseCrit(cr){const m=cr.match(/^(>=|<=|<>|>|<|=)?(.+)$/);if(!m)return{op:'=',val:cr,n:parseFloat(cr)};return{op:m[1]||'=',val:m[2],n:parseFloat(m[2])};}
function matchCrit(cv,cr){const{op,val,n}=parseCrit(cr);const nv=typeof cv==='number'?cv:parseFloat(cv)||0;if(op==='=')return String(cv).toLowerCase()===val.toLowerCase()||nv===n;if(op==='>')return nv>n;if(op==='>=')return nv>=n;if(op==='<')return nv<n;if(op==='<=')return nv<=n;if(op==='<>')return nv!==n;return false;}
function evalFormula(f,cells){
  if(!f||!f.startsWith('='))return f;
  const raw=f.slice(1).trim();
  const fm=raw.match(/^([A-Za-z]+)\((.+)\)$/s);
  if(fm){
    const fn=fm[1].toUpperCase(),args=splitArgs(fm[2]);
    const rng=a=>expandRange(a.trim().toUpperCase(),cells);
    switch(fn){
      case'SUM':return rng(args[0]).map(toNum).reduce((a,b)=>a+b,0);
      case'AVERAGE':{const v=rng(args[0]).map(toNum);return v.reduce((a,b)=>a+b,0)/v.length;}
      case'MAX':return Math.max(...rng(args[0]).map(toNum));
      case'MIN':return Math.min(...rng(args[0]).map(toNum));
      case'COUNT':return rng(args[0]).filter(v=>typeof v==='number').length;
      case'COUNTA':return rng(args[0]).filter(v=>v!=null&&v!=='').length;
      case'IF':{if(args.length<3)return'#VALUE!';const cond=evalCond(args[0].trim().toUpperCase(),cells);const tv=args[1].trim().replace(/^["']|["']$/g,'');const fv=args[2].trim().replace(/^["']|["']$/g,'');return cond?tv:fv;}
      case'ROUND':{const ref=args[0].trim().toUpperCase();const val=/^[A-Z]\d+$/.test(ref)?toNum(cells[ref]):parseFloat(args[0])||0;const d=parseInt(args[1]);const f2=Math.pow(10,d);return Math.round(val*f2)/f2;}
      case'COUNTIF':{const vals=rng(args[0]);const cr=args[1].trim().replace(/^["']|["']$/g,'');return vals.filter(v=>matchCrit(v,cr)).length;}
      case'SUMIF':{if(args.length<2)return'#VALUE!';const cv=rng(args[0]);const cr=args[1].trim().replace(/^["']|["']$/g,'');const sv=args.length>=3?rng(args[2]):cv;return cv.reduce((s,v,i)=>matchCrit(v,cr)?s+toNum(sv[i]):s,0);}
      case'VLOOKUP':{if(args.length<3)return'#N/A';const a0=args[0].trim().toUpperCase();const lv=/^[A-Z]\d+$/.test(a0)?String(cells[a0]??''):args[0].trim().replace(/^["']|["']$/g,'');const tm=args[1].trim().toUpperCase().match(/^([A-Z])(\d+):([A-Z])(\d+)$/);if(!tm)return'#N/A';const[,sc,sr,ec,er]=tm;const ci=parseInt(args[2])-1;for(let r=+sr;r<=+er;r++){const fc=cells[sc+r];if(String(fc??'').toLowerCase()===lv.toLowerCase()){const tc=String.fromCharCode(sc.charCodeAt(0)+ci);return cells[tc+r]??'#N/A';}}return'#N/A';}
      default:return'#NAME?';
    }
  }
  if(/^[A-Za-z]\d+$/.test(raw))return cells[raw.toUpperCase()]??'';
  return'#VALUE!';
}
function evalCond(e,cells){
  for(const op of['>=','<=','<>','!=','>','<','=']){
    const i=e.indexOf(op);if(i>0){const L=e.slice(0,i).trim(),R=e.slice(i+op.length).trim();const lv=/^[A-Z]\d+$/.test(L)?toNum(cells[L]):parseFloat(L)||0;const rv=/^[A-Z]\d+$/.test(R)?toNum(cells[R]):parseFloat(R)||0;if(op==='>=')return lv>=rv;if(op==='<=')return lv<=rv;if(op==='<>'||op==='!=')return lv!==rv;if(op==='>')return lv>rv;if(op==='<')return lv<rv;if(op==='=')return lv===rv;}
  }
  return false;
}
function fmtVal(v){if(v===null||v===undefined||v==='')return'';if(typeof v==='number'){if(Number.isInteger(v))return v.toLocaleString();return parseFloat(v.toFixed(4)).toLocaleString();}return String(v);}

function bindRibbon(){
  document.querySelectorAll('[data-settab]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();S.tab=b.dataset.settab;S.dd=null;buildRibbon();}));
  document.querySelectorAll('[data-dd]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    S.dd = S.dd===b.dataset.dd ? null : b.dataset.dd;
    buildRibbon();
    if(S.dd){
      var menu = b.parentElement.querySelector('.dd-menu');
      if(menu){
        var r = b.getBoundingClientRect();
        menu.style.top = (r.bottom+2)+'px';
        menu.style.left = r.left+'px';
        var mw = menu.offsetWidth||200;
        if(r.left+mw > window.innerWidth) menu.style.left=(window.innerWidth-mw-4)+'px';
      }
    }
  }));
  document.querySelectorAll('[data-dditem]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();S.dd=null;doAction(b.dataset.dditem);}));
  document.querySelectorAll('[data-action]:not([data-dd])').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();doAction(b.dataset.action);}));
}
document.addEventListener('click',()=>{if(S.dd){S.dd=null;buildRibbon();}});

function doAction(a){
  S.dd=null;
  if(a==='insert-fn'){
    document.getElementById('dlg').style.display='block';
    document.getElementById('backdrop').style.display='block';
    return;
  }
  buildRibbon();
}

window.closeDlg=function(){document.getElementById('dlg').style.display='none';document.getElementById('backdrop').style.display='none';};

// ═══════════════════════════════════════════
// SHEET / CELL RENDER
// ═══════════════════════════════════════════
function renderSheet(){
  const lab=LABS[S.lab];
  const done=!!S.res[lab.id];
  const result=S.res[lab.id];
  const cols=lab.cols;
  const colW=lab.colWidths||{};

  // Column headers
  let colHtml=`<div class="row-num-spacer"></div>`;
  cols.forEach(c=>{
    const w=colW[c]||90;
    const act=S.selCell&&S.selCell[0]===c;
    colHtml+=`<div class="col-hdr${act?' active-col':''}" style="width:${w}px">${c}</div>`;
  });
  document.getElementById('col-headers').innerHTML=colHtml;

  // Build cells with computed formula value
  const displayCells={...lab.cells};
  if(done&&result){
    displayCells[lab.target]=result.computed;
  }

  // Sheet table
  let html='<table><tbody>';
  for(let r=1;r<=lab.rows;r++){
    const actRow=S.selCell&&S.selCell.slice(1)===String(r);
    html+=`<tr><td class="row-num${actRow?' active-row':''}">${r}</td>`;
    cols.forEach(c=>{
      const ref=c+r;
      const isTarget=ref===lab.target;
      const isSel=S.selCell===ref;
      const rawVal=lab.cells[ref];
      const dispVal=displayCells[ref];
      let cls='cell';
      if(r===1)cls+=' header-cell';
      else if(typeof rawVal==='number'||typeof dispVal==='number')cls+=' num-cell';
      if(isTarget&&!done)cls+=' target-cell';
      if(isTarget&&done&&result?.correct)cls+=' target-cell correct result-cell';
      if(isTarget&&done&&!result?.correct)cls+=' target-cell wrong';
      if(isSel&&!isTarget)cls+=' selected';
      const w=colW[c]||90;
      const txt=isTarget&&done&&result?fmtVal(result.computed):(dispVal!==null&&dispVal!==undefined?fmtVal(dispVal):'');
      const txtColor=isTarget&&done?result?.correct?'color:#217346':'color:#c00':'';
      html+=`<td class="${cls}" data-ref="${ref}" style="width:${w}px;${txtColor}" title="${ref}">${txt}</td>`;
    });
    html+='</tr>';
  }
  html+='</tbody></table>';
  document.getElementById('sheet-body').innerHTML=html;

  // Bind cell clicks
  document.querySelectorAll('[data-ref]').forEach(td=>{
    td.addEventListener('click',()=>{
      S.selCell=td.dataset.ref;
      const fbar=document.getElementById('fbar-input');
      const nb=document.getElementById('name-box');
      if(nb)nb.textContent=S.selCell;
      if(fbar){
        if(S.selCell===lab.target){
          fbar.value=S.formula;
          fbar.focus();
          fbar.placeholder=`Type your formula, e.g. ${lab.hint}`;
        } else {
          const v=lab.cells[S.selCell];
          fbar.value=v!==null&&v!==undefined?String(v):'';
        }
      }
      renderSheet();
    });
  });

  // Update formula bar name box
  const nb=document.getElementById('name-box');
  if(nb)nb.textContent=S.selCell||lab.target;

  // Status bar updates
  if(done&&result){document.getElementById('st-sum').textContent=`Sum: ${fmtVal(result.computed)}`;}
}

// ═══════════════════════════════════════════
// FORMULA BAR HANDLER
// ═══════════════════════════════════════════
function initFbar(){
  const fbar=document.getElementById('fbar-input');
  const nb=document.getElementById('name-box');
  fbar.addEventListener('input',e=>{
    S.formula=e.target.value;
    if(nb)nb.textContent=LABS[S.lab].target;
  });
  fbar.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();gradeFormula();}
    if(e.key==='Escape'){e.preventDefault();S.formula='';fbar.value='';renderSheet();}
  });
}

function gradeFormula(){
  const lab=LABS[S.lab];
  const f=S.formula.trim();
  if(!f)return;
  if(!f.startsWith('=')){
    S.res[lab.id]={correct:false,score:0,computed:'#VALUE!',msg:'Formulas must start with = (equals sign).'};
    renderAll();return;
  }
  const computed=evalFormula(f,lab.cells);
  const result=lab.validate(f,computed);
  S.res[lab.id]={...result,computed};
  S.wrong=!result.correct;
  renderAll();
}

// ═══════════════════════════════════════════
// TASK PANEL
// ═══════════════════════════════════════════
function renderTask(){
  const lab=LABS[S.lab],done=!!S.res[lab.id],result=S.res[lab.id];
  let fb='';
  if(result&&!result.correct) fb=`<div class="fb fb-err" style="animation:fadeIn .25s"><strong>✗ ${result.score}/10</strong> — ${result.msg}</div>`;
  if(result?.correct){
    fb=`<div class="fb fb-ok" style="animation:fadeIn .25s"><strong>✓ ${result.score}/10</strong> — ${result.msg}<div style="margin-top:6px;padding-top:6px;border-top:1px solid #86efac;font-size:11px">${lab.exp}</div></div>`;
    fb+=`<div class="fb-next">
      ${S.lab===LABS.length-1
        ?`<button class="btn btn-green" onclick="showFinal()">View results →</button>`
        :`<button class="btn btn-ghost" onclick="resetLab()">Try again</button><button class="btn btn-green" onclick="goLab(${S.lab+1})">Next lab →</button>`}
    </div>`;
  }
  document.getElementById('task-panel').innerHTML=`
    <div class="task-row">
      <span class="task-badge">${lab.obj}</span>
      <div class="task-text">${lab.task}</div>
      <div class="task-acts">
        <button class="btn btn-ghost" onclick="toggleHint()">${S.hint?'Hide hint':'Hint'}</button>
        ${!done?`<button class="btn btn-ghost" onclick="gradeFormula()">Grade ↵</button>`:''}
        ${!done?`<button class="btn btn-ghost" onclick="resetLab()">Reset</button>`:''}
      </div>
    </div>
    ${S.hint?`<div class="hint-row">💡 Hint: <code style="font-family:Consolas,monospace;font-size:12px">${lab.hint}</code></div>`:''}
    <div style="font-size:11px;color:#6b7280;margin-top:5px">Scenario: ${lab.scenario} | Click the highlighted cell (${lab.target}), type your formula, press Enter.</div>
    ${fb}`;
}
window.toggleHint=function(){S.hint=!S.hint;renderTask();};
window.resetLab=function(){delete S.res[LABS[S.lab].id];S.formula='';S.hintCount=0;S.selCell=LABS[S.lab].target;document.getElementById('fbar-input').value='';renderAll();};

// ═══════════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════════
function renderSidebar(){
  const ts=score();
  document.getElementById('sb-score').textContent=`${ts} / ${MAX}`;
  document.getElementById('sb-fill').style.width=`${(ts/MAX*100).toFixed(0)}%`;
  document.getElementById('prog-fill').style.width=`${(ts/MAX*100).toFixed(0)}%`;
  let h='';
  DOMAINS.forEach(d=>{
    h+=`<div class="sb-domain">${d.label}</div>`;
    d.labs.forEach(li=>{
      const l=LABS[li],done=!!S.res[l.id],act=li===S.lab;
      h+=`<button class="lab-btn${act?' active':''}${done?' done':''}" onclick="goLab(${li})">
        <span class="lab-dot${act?' active':''}${done?' done':''}">${done?'✓':li+1}</span>
        <div><div class="lab-name">${l.name}</div><div class="lab-obj">${l.domain}</div></div>
      </button>`;
    });
  });
  document.getElementById('sb-nav').innerHTML=h;
}

// ═══════════════════════════════════════════
// FINAL SCREEN
// ═══════════════════════════════════════════
window.showFinal=function(){
  const ts=score(),pct=Math.round(ts/MAX*100);
  document.getElementById('sheet-body').innerHTML=`<div style="padding:30px;text-align:center;background:#fff;min-height:300px">
    <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px">Excel — IS101 — Formulas Domain</div>
    <div style="font-size:60px;font-weight:800;color:${pct>=80?'#15803d':pct>=60?'#d97706':'#dc2626'};line-height:1">${ts}<span style="font-size:30px;font-weight:400;color:#9ca3af"> / ${MAX}</span></div>
    <div style="font-size:14px;color:#6b7280;margin:8px 0 24px">${pct}% — ${pct>=80?'Course ready!':pct>=60?'Good — review missed labs.':'Keep practising.'}</div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:500px;margin:0 auto;text-align:left">
      ${LABS.map(l=>{const ok=S.res[l.id];return`<div style="background:${ok?.correct?'#f0fdf4':'#fef2f2'};border:1px solid ${ok?.correct?'#86efac':'#fca5a5'};padding:8px 10px;border-radius:4px">
        <div style="font-size:9px;font-weight:700;text-transform:uppercase;color:${ok?.correct?'#15803d':'#dc2626'};margin-bottom:3px">${ok?.correct?'✓':'✗'} ${ok?.score||0}/10</div>
        <div style="font-size:12px;font-weight:600;color:${ok?.correct?'#166534':'#991b1b'};font-family:Consolas,monospace">${l.name}</div>
      </div>`;}).join('')}
    </div>
    <button class="btn btn-green" style="margin-top:20px" onclick="goLab(0)">Restart all labs</button>
  </div>`;
  document.getElementById('col-headers').innerHTML='';
  document.getElementById('task-panel').innerHTML='';
};

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════
window.goLab=function(i){
  S.lab=i;S.formula='';S.hintCount=0;S.wrong=false;S.dd=null;
  S.selCell=LABS[i].target;
  S.tab=LABS[i].tab||'formulas';
  document.getElementById('fbar-input').value='';
  const nb=document.getElementById('name-box');
  if(nb)nb.textContent=LABS[i].target;
  renderAll();
};

function renderAll(){
  renderSidebar();
  buildRibbon();
  renderSheet();
  renderTask();
}

initFbar();
renderAll();
</script>
</body>
</html>
