ian home price in Clark County rose 34% between 2020 and 2024, far outpacing wage growth for service-sector workers. By 2024, housing costs consumed more than 40% of median household income for the bottom two income quintiles in the Las Vegas metropolitan area.<sup style=\"color:#2b579a;font-size:9px\">1</sup></p><p class=\"dp\">This disparity has accelerated displacement from high-cost neighborhoods into North Las Vegas and the unincorporated areas of Clark County.</p><div style=\"border-top:1px solid #d1d5db;margin-top:24px;padding-top:6px;font-size:11px;color:#1a1a1a\"><sup style=\"font-size:9px\">1</sup> Nevada Housing Coalition. (2024). <em>Clark County Housing Affordability Report</em>. Las Vegas, NV.</div><p style=\"margin-top:10px;font-size:10px;color:#15803d;font-weight:700\">✓ Footnote 1 inserted at bottom of page with superscript reference in text.</p>", "prompt": "I am learning Word 365. How do I insert a footnote in Word? How is a footnote different from an endnote? How do I edit or delete a footnote after inserting it?", "youtube": "https://www.youtube.com/results?search_query=word+365+insert+footnote", "ms": "https://support.microsoft.com/en-us/office/insert-footnotes-and-endnotes-61f3fb1a-4717-414a-a570-5f3d3fad3d3c"}, {"id": 1, "name": "Insert an Endnote", "tab": "references", "action": "insert-endnote", "docTitle": "CSN_SociologyPaper.docx — Word", "task": "Insert an <strong>endnote</strong> at the end of the highlighted sentence. Endnotes appear at the end of the document rather than the bottom of each page.", "hints": ["Endnotes are on the References tab, in the same group as footnotes.", "On the References tab, find the Footnotes group. Look for Insert Endnote next to Insert Footnote.", "Click at the end of the sentence first, then click Insert Endnote. Word jumps to the end of the document where you type the endnote text."], "answer": "Click at end of sentence → References tab → Footnotes group → Insert Endnote → type endnote text.", "exp": "Insert Endnote (References → Footnotes → Insert Endnote): like a footnote but appears at the very end of the document instead of the page bottom. Endnotes use Roman numerals (i, ii, iii) by default.", "before_html": "<p class=\"dt\">Social Stratification in Urban Nevada</p><p class=\"dh1\">Employment and Social Mobility</p><p class=\"dp\">Casino and hospitality employment accounts for 28% of total employment in Clark County, making Nevada's economy unusually dependent on a single sector. <span class=\"dsel\">Research consistently shows that service-sector employment in tourism-dependent economies provides limited pathways for intergenerational upward mobility.</span></p><p class=\"dp\">Higher education enrollment at CSN and UNLV has increased 12% since 2021, suggesting residents are seeking alternative pathways to economic mobility.</p><p class=\"dp\" style=\"color:#6b7280;font-size:11px;font-style:italic\">← Click at the end of the highlighted sentence, then insert an endnote using References → Footnotes group.</p>", "after_html": "<p class=\"dt\">Social Stratification in Urban Nevada</p><p class=\"dh1\">Employment and Social Mobility</p><p class=\"dp\">Casino and hospitality employment accounts for 28% of total employment in Clark County, making Nevada's economy unusually dependent on a single sector. Research consistently shows that service-sector employment in tourism-dependent economies provides limited pathways for intergenerational upward mobility.<sup style=\"color:#2b579a;font-size:9px\">i</sup></p><p class=\"dp\">Higher education enrollment at CSN and UNLV has increased 12% since 2021, suggesting residents are seeking alternative pathways to economic mobility.</p><div style=\"border-top:2px solid #1a1a1a;margin-top:24px;padding-top:8px\"><p style=\"font-size:11px;font-weight:700;color:#1a1a1a;margin-bottom:6px\">Endnotes</p><p style=\"font-size:11px;color:#1a1a1a\"><sup style=\"font-size:9px\">i</sup> Smith, R. & Jones, T. (2022). <em>Tourism economies and social mobility: A cross-regional analysis.</em> Journal of Economic Sociology, 14(2), 88–112.</p></div><p style=\"margin-top:10px;font-size:10px;color:#15803d;font-weight:700\">✓ Endnote i inserted — appears at end of document with superscript reference in text.</p>", "prompt": "I am learning Word 365. What is the difference between a footnote and an endnote? When would I use each one? How do I insert an endnote in Word?", "youtube": "https://www.youtube.com/results?search_query=word+365+insert+endnote", "ms": "https://support.microsoft.com/en-us/office/insert-footnotes-and-endnotes-61f3fb1a-4717-414a-a570-5f3d3fad3d3c"}, {"id": 2, "name": "Modify Footnote/Endnote Properties", "tab": "references", "action": "footnote-properties", "docTitle": "CSN_SociologyPaper.docx — Word", "task": "The professor requires footnotes to use <strong>lowercase Roman numerals (i, ii, iii)</strong> instead of Arabic numbers (1, 2, 3). Change the footnote number format.", "hints": ["Footnote properties are in the References tab, Footnotes group.", "On the References tab, click the small dialog launcher arrow in the bottom-right corner of the Footnotes group.", "In the Footnote and Endnote dialog, change the Number format dropdown from '1, 2, 3' to 'i, ii, iii' and click Apply."], "answer": "References tab → Footnotes group → dialog launcher → Number format: i, ii, iii → Apply.", "exp": "Footnote/Endnote Properties (Footnotes dialog launcher): change number format (1,2,3 or i,ii,iii or a,b,c), starting number, and whether numbering restarts each page or section.", "dlg": "dlg-footnoteprops", "before_html": "<p class=\"dt\">Social Stratification in Urban Nevada</p><p class=\"dh1\">Housing and Economic Inequality</p><p class=\"dp\">The median home price in Clark County rose 34% between 2020 and 2024.<sup style=\"color:#2b579a;font-size:9px\">1</sup> By 2024, housing costs consumed more than 40% of median household income.<sup style=\"color:#2b579a;font-size:9px\">2</sup></p><p class=\"dp\">R insert-footnotes-and-endnotes-61f3fb1a-4717-414a-a570-5f3d3fad3d3c"}, {"id": 3, "name": "Insert Table of Contents", "tab": "references", "action": "insert-toc", "docTitle": "DesertSunReport.docx — Word", "task": "Insert an <strong>automatic Table of Contents</strong> at the top of this document. Word will generate it from the Heading 1 and Heading 2 styles already applied.", "hints": ["Table of Contents is on the References tab.", "On the References tab, find the Table of Contents group on the far left. Click the Table of Contents button.", "Choose one of the automatic styles (Automatic Table 1 or Automatic Table 2). Word builds the TOC from all Heading 1, 2, and 3 paragraphs."], "answer": "References tab → Table of Contents group → Table of Contents → Automatic Table 1 (or 2).", "exp": "Table of Contents (References → Table of Contents): auto-generates a TOC from all Heading 1, 2, and 3 paragraphs with page numbers. Click inside it and press F9 (or click Update Table) to refresh after edits.", "before_html": "<div style=\"border:2px dashed #c5d9f7;border-radius:4px;padding:16px;text-align:center;color:#6b7280;font-size:13px;margin-bottom:16px\">← Insert the Table of Contents here</div><p class=\"dt\">Annual Business Report</p><p class=\"dh1\">Executive Summary</p><p class=\"dp\">Total revenue for fiscal year 2026 reached $4.2 million.</p><p class=\"dh1\">Financial Highlights</p><p class=\"dp\">Advisory services accounted for 58% of total revenue.</p><p class=\"dh2\">Quarterly Breakdown</p><p class=\"dp\">Q1: $1.02M &nbsp; Q2: $1.14M &nbsp; Q3: $1.08M &nbsp; Q4: $0.96M</p><p class=\"dh1\">Regional Performance</p><p class=\"dp\">Nevada operations drove 64% of total revenue growth.</p><p class=\"dp\" style=\"color:#6b7280;font-size:11px;font-style:italic\">← Use References → Table of Contents to insert an automatic TOC above the title.</p>", "after_html": "<div style=\"background:#f8faff;border:1px solid #dbeafe;padding:16px 20px;margin-bottom:16px\"><p style=\"font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:10px\">Contents</p><div style=\"display:flex;justify-content:space-between;font-size:13px;color:#1a1a1a;margin-bottom:4px\"><span>Executive Summary</span><span style=\"border-bottom:1px dotted #9ca3af;flex:1;margin:0 6px\"></span><span>1</span></div><div style=\"display:flex;justify-content:space-between;font-size:13px;color:#1a1a1a;margin-bottom:4px\"><span>Financial Highlights</span><span style=\"border-bottom:1px dotted #9ca3af;flex:1;margin:0 6px\"></span><span>2</span></div><div style=\"display:flex;justify-content:space-between;font-size:12px;color:#4b5563;margin-bottom:4px;padding-left:16px\"><span>Quarterly Breakdown</span><span style=\"border-bottom:1px dotted #9ca3af;flex:1;margin:0 6px\"></span><span>2</span></div><div style=\"display:flex;justify-content:space-between;font-size:13px;color:#1a1a1a;margin-bottom:4px\"><span>Regional Performance</span><span style=\"border-bottom:1px dotted #9ca3af;flex:1;margin:0 6px\"></span><span>3</span></div></div><p class=\"dt\">Annual Business Report</p><p class=\"dh1\">Executive Summary</p><p class=\"dp\">Total revenue for fiscal year 2026 reached $4.2 million.</p><p style=\"margin-top:10px;font-size:10px;color:#15803d;font-weight:700\">✓ Automatic Table of Contents inserted — built from Heading 1 and Heading 2 styles.</p>", "prompt": "I am learning Word 365. How do I insert an automatic Table of Contents? What heading styles does it use? How do I update it after making changes to the document?", "youtube": "https://www.youtube.com/results?search_query=word+365+insert+table+of+contents+automatic", "ms": "https://support.microsoft.com/en-us/office/insert-a-table-of-contents-882e9da2-2d0b-4c67-96c4-4dc0e48c692d"}, {"id": 4, "name": "Customize Table of Contents", "tab": "references", "action": "custom-toc", "docTitle": "DesertSunReport.docx — Word", "task": "Customize the Table of Contents to show <strong>only Heading 1 and Heading 2</strong> (not Heading 3), and change the tab leader to a solid line.", "hints": ["Custom TOC settings are in the Table of Contents dialog.", "On the References tab, click Table of Contents, then choose 'Custom Table of Contents…' at the bottom of the dropdown.", "In the dialog, change 'Show levels' to 2 (instead of 3), and change the Tab leader to a solid line. Click OK."], "answer": "References tab → Table of Contents → Custom Table of Contents → Show levels: 2 → Tab leader: solid line → OK.", "exp": "Custom TOC (References → Table of Contents → Custom Table of Contents): control how many heading levels appear, change the tab leader style (dots, dashes, solid line, none), and modify the TOC format.", "dlg": "dlg-customtoc", "before_html": "<div style=\"background:#f8faff;border:1px solid #dbeafe;padding:16px 20px;margin-bottom:16px\"><p style=\"font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:10px\">Contents</p><div style=\"display:flex;justify-content:space-between;font-size:13px;color:#1a1a1a;margin-bottom:4px\"><span>Executive Summary</span><span style=\"border-bottom:1px dotted #9ca3af;flex:1;margin:0 6px\"></span><span>1</span></div><div style=\"display:flex;justify-content:space-between;font-size:12px;color:#4b5563;margin-bottom:4px;padding-left:16px\"><span>Background</span><span style=\"border-bottom:1px dotted #9ca3af;flex:1;margin:0 6px\"></span><span>1</span></div><div style=\"display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-bottom:4px;padding-left:32px\"><span>Context and Scope</span><span style=\"border-bottom:1px dotted #9ca3af;flex:1;margin:0 6px\"></span><span>2</span></div><div style=\"display:flex;justify-content:space-between;font-size:13px;color:#1a1a1a;margin-bottom:4px\"><span>Financial Highlights</span><span style=\"border-bottom:1px dotted #9ca3af;flex:1;margin:0 6px\"></span><span>2</span></div></div><p class=\"dp\" style=\"color:#6b7280;font-size:11px;font-style:italic\">← The TOC above shows 3 levels. Customize it to show only 2 levels with a solid line tab leader.</p>", "after_html": "<div style=\"background:#f8faff;border:1px solid #dbeafe;padding:16px 20px;margin-bottom:16px\"><p style=\"font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:10px\">Contents</p><div style=\"display:flex;justify-content:space-between;font-size:13px;color:#1a1a1a;margin-bottom:4px\"><span>Executive Summary</span><span style=\"border-bottom:1px solid #9ca3af;flex:1;margin:0 6px\"></span><span>1</span></div><div style=\"display:flex;justify-content:space-between;font-size:12px;color:#4b5563;margin-bottom:4px;padding-left:16px\"><span>Background</span><span style=\"border-bottom:1px solid #9ca3af;flex:1;margin:0 6px\"></span><span>1</span></div><div style=\"display:flex;justify-content:space-between;font-size:13px;color:#1a1a1a;margin-bottom:4px\"><span>Financial Highlights</span><span style=\"border-bottom:1px solid #9ca3af;flex:1;margin:0 6px\"></span><span>2</span></div></div><p class=\"dp\" style=\"color:#6b7280;font-size:11px;font-style:italic\">The Heading 3 entries have been removed and the tab leader is now a solid line.</p><p style=\"margin-top:10px;font-size:10px;color:#15803d;font-weight:700\">✓ TOC customized — 2 levels shown, solid line tab leader applied.</p>", "prompt": "I am learning Word 365. How do I customize a Table of Contents to show fewer heading levels? How do I change the tab leader from dots to a solid line? Where is the Custom Table of Contents dialog?", "youtube": "https://www.youtube.com/results?search_query=word+365+customize+table+of+contents", "ms": "https://support.microsoft.com/en-us/office/format-or-customize-a-table-of-contents-9d85eb9c-0b55-4795-8abb-a49885b3a58d"}];
const DLG_MAP = {"footnote-properties": "dlg-footnoteprops", "custom-toc": "dlg-customtoc"};
const TOTAL = 5;

const S={lab:0,tab:'references',res:{},wrongCount:0,hintCount:0,dd:null};
const score=()=>Object.keys(S.res).filter(k=>S.res[k]).length;

function LB(icon,label,action,ddItems){
  const lab=LABS[S.lab],isHL=action===lab.action;
  const cls='lb'+(isHL?' hl':'');
  const inner=`<span class="li">${icon}</span><span class="ll">${label}</span>`;
  if(ddItems){
    const open=S.dd===action;
    return`<div class="dd-wrap"><button class="${cls}" data-action="${action}" data-dd="${action}">${inner}</button><div class="dd-menu${open?' open':''}">${ddItems.map(d=>d[1]==='dd-sep'?'<div class="dd-sep"></div>':`<button class="dd-item" data-dditem="${d[1]}">${d[0]}</button>`).join('')}</div></div>`;
  }
  return`<button class="${cls}" data-action="${action}">${inner}</button>`;
}
function SB(icon,label,action){
  const isHL=LABS[S.lab].action===action;
  return`<button class="sb${isHL?' hl':''}" data-action="${action}"><span class="si">${icon}</span><span class="sl">${label}</span></button>`;
}
function STACK(...b){return`<div class="sb-stack">${b.join('')}</div>`;}
function GRP(label,html){return`<div class="grp"><div class="grp-btns">${html}</div><div class="grp-lbl">${label}</div></div>`;}

function buildRibbon(){
  const lab=LABS[S.lab];
  const tabs=[['home','Home'],['insert','Insert'],['design','Design'],['layout','Layout'],['references','References'],['review','Review']];
  document.getElementById('tab-strip').innerHTML=tabs.map(([id,lbl])=>`<button class="tab${S.tab===id?' active':''}" data-settab="${id}">${lbl}</button>`).join('');
  let body='';
  const t=S.tab;

  if(t==='home'){
    body+=GRP('Clipboard',LB('&#128203;','Paste','paste',[['Paste','paste']])+STACK(SB('&#9986;','Cut','cut'),SB('&#128196;','Copy','copy')));
    body+=GRP('Font',`<div style="padding:8px 4px;font-size:11px;color:#555">Font, Size, Bold, Italic&hellip;</div>`);
    body+=GRP('Paragraph',`<div style="padding:8px 4px;font-size:11px;color:#555">Lists, Alignment&hellip;</div>`);
    body+=GRP('Styles',`<div style="padding:8px 4px;font-size:11px;color:#555">Normal, Heading 1&hellip;</div>`);
    body+=GRP('Editing',LB('&#128269;','Find','find',[['Find','find'],['Replace','replace']]));
  }
  else if(t==='insert'){
    body+=GRP('Pages',STACK(SB('&#128196;','Cover Page','cover'),SB('&#8212;','Page Break','pagebreak')));
    body+=GRP('Tables',LB('&#8862;','Table','insert-table',[['Insert Table','insert-table']]));
    body+=GRP('Illustrations',LB('&#128444;','Pictures','insert-pic'));
    body+=GRP('Links',LB('&#128279;','Hyperlink','insert-hyperlink'));
    body+=GRP('Header & Footer',LB('&#8868;','Header','insert-header',[['Blank','insert-header']])+LB('&#8869;','Footer','insert-footer',[['Blank','insert-footer']])+LB('#','Page&#10;Number','insert-pagenum',[['Top of Page','insert-pagenum']]));
  }
  else if(t==='design'){
    body+=GRP('Document Formatting',`<div style="padding:8px 4px;font-size:11px;color:#555">Style Sets gallery&hellip;</div>`);
    body+=GRP('Page Background',LB('&#128203;','Watermark','watermark',[['DRAFT','watermark']])+LB('&#9632;','Page&#10;Color','page-color',[['No Color','page-color']]));
  }
  else if(t==='layout'){
    body+=GRP('Page Setup',LB('&#9633;','Margins','margins',[['Normal','margins']])+LB('&#8861;','Orientation','orient',[['Portrait','portrait'],['Landscape','landscape']])+LB('&#128196;','Size','size',[['Letter','letter']]));
    body+=GRP('Paragraph',`<div style="padding:8px 4px;font-size:11px;color:#555">Indent, Spacing&hellip;</div>`);
  }
  else if(t==='references'){
    body+=GRP('Table of Contents',
      LB('&#8801;','Table of&#10;Contents','insert-toc',[
        ['Automatic Table 1','insert-toc'],
        ['Automatic Table 2','insert-toc'],
        ['Manual Table','toc-manual'],
        ['&#8212;','dd-sep'],
        ['Custom Table of Contents…','custom-toc']
      ])+
      STACK(SB('+','Add Text','add-text'),SB('&#8635;','Update Table','update-toc')));
    body+=GRP('Footnotes',
      LB('AB&#185;','Insert&#10;Footnote','insert-footnote')+
      LB('AB&#8305;','Insert&#10;Endnote','insert-endnote')+
      STACK(
        SB('&#8594;&#185;','Next Footnote','next-fn'),
        SB('&#8644;','Show Notes','show-notes'),
        SB('&#9698;','Properties','footnote-properties')
      ));
    body+=GRP('Citations & Bibliography',
      LB('&#128218;','Insert&#10;Citation','insert-citation')+
      STACK(SB('&#128201;','Manage Sources','manage-src'),SB('APA','Style','citation-style'),SB('&#8801;','Bibliography','bibliography')));
    body+=GRP('Captions',
      LB('&#9135;','Insert&#10;Caption','insert-caption')+
      STACK(SB('&#8801;','Table of Figures','tof'),SB('&#8596;','Cross-ref','cross-ref')));
    body+=GRP('Index',
      LB('&#128450;','Mark&#10;Entry','mark-entry')+
      STACK(SB('&#8801;','Insert Index','insert-index')));
  }
  else if(t==='review'){
    body+=GRP('Proofing',LB('&#10003;','Spelling','spelling')+LB('&#128218;','Thesaurus','thesaurus'));
    body+=GRP('Comments',LB('&#128172;','New&#10;Comment','new-comment')+STACK(SB('&#9664;','Previous','prev-cmt'),SB('&#9654;','Next','next-cmt')));
    body+=GRP('Tracking',LB('&#9999;','Track&#10;Changes','track-changes',[['Track Changes','track-changes']]));
    body+=GRP('Changes',
      LB('<span style="color:#15803d">&#10004;</span>','Accept','accept',[['Accept All','accept']])+
      LB('<span style="color:#dc2626">&#10006;</span>','Reject','reject',[['Reject All','reject']]));
  }

  document.getElementById('ribbon-body').innerHTML=body;
  bindRibbon();
}

function bindRibbon(){
  document.querySelectorAll('[data-settab]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();S.tab=b.dataset.settab;S.dd=null;buildRibbon();}));
  document.querySelectorAll('[data-dd]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();S.dd=S.dd===b.dataset.dd?null:b.dataset.dd;buildRibbon();
    if(S.dd){const m=b.parentElement.querySelector('.dd-menu');if(m){const r=b.getBoundingClientRect();m.style.top=(r.bottom+2)+'px';m.style.left=r.left+'px';}}
  }));
  document.querySelectorAll('[data-dditem]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();S.dd=null;doAction(b.dataset.dditem);}));
  document.querySelectorAll('[data-action]:not([data-dd])').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();doAction(b.dataset.action);}));
}
document.addEventListener('click',()=>{if(S.dd){S.dd=null;buildRibbon();}}); 

function doAction(a){
  S.dd=null;
  const lab=LABS[S.lab];
  if(a===lab.action){
    const dlgId=DLG_MAP[lab.action];
    if(dlgId)openDlg(dlgId);else grade();
    buildRibbon();return;
  }
  wrong();buildRibbon();
}

function openDlg(id){document.getElementById('backdrop').style.display='block';document.getElementById(id).style.display='block';}
function closeDlg(){document.getElementById('backdrop').style.display='none';document.querySelectorAll('.w-dlg').forEach(d=>d.style.display='none');}
window.dlgGrade=function(){closeDlg();grade();};

function grade(){S.res[LABS[S.lab].id]=true;S.wrongCount=0;S.hintCount=0;saveProgress();renderAll();}
function wrong(){
  if(!S.res[LABS[S.lab].id]){
    S.wrongCount++;
    renderTask();renderSidebar();
  }
}

function renderDoc(){
  const lab=LABS[S.lab],done=!!S.res[lab.id];
  document.getElementById('doc-page').innerHTML=done?lab.after_html:lab.before_html;
  if(lab.docTitle)document.getElementById('doc-title').textContent=lab.docTitle;
}

function renderTask(){
  const lab=LABS[S.lab],done=!!S.res[lab.id];
  let fb='';
  if(S.wrongCount>0&&!done){
    fb=S.wrongCount>=3
      ?`<div class="fb fb-err" style="animation:fadeIn .25s"><strong>Here is the answer:</strong> ${lab.answer}</div>`
      :`<div class="fb fb-err" style="animation:fadeIn .25s"><strong>Not quite.</strong> ${S.tab!=='references'?'<em>Tip: All D4 skills are on the References tab.</em>':'Look for the highlighted button.'} (Attempt ${S.wrongCount} of 3)</div>`;
  }
  if(done){
    fb=`<div class="fb fb-ok" style="animation:fadeIn .25s"><strong>&#10003; Correct!</strong> ${lab.exp}</div>
    <div class="fb-next">
      ${S.lab===LABS.length-1
        ?`<button class="btn btn-blue" onclick="showFinal()">View results &#8594;</button>`
        :`<button class="btn btn-ghost" onclick="goLab(${S.lab})">Replay</button><button class="btn btn-blue" onclick="goLab(${S.lab+1})">Next &#8594;</button>`}
    </div>`;
  }
  let hintsHtml='';
  if(S.hintCount>0){
    hintsHtml='<div class="hint-area">'+(lab.hints||[]).slice(0,S.hintCount).map((h,i)=>`<div class="hint-row"><span class="hint-num">Hint ${i+1}</span> ${h}</div>`).join('');
    if(S.wrongCount>=3&&lab.answer)hintsHtml+=`<div class="hint-row hint-answer"><span class="hint-num answer-tag">Answer</span> ${lab.answer}</div>`;
    hintsHtml+='</div>';
  }
  const hintDis=S.hintCount>=(lab.hints||[]).length||done;
  document.getElementById('task-panel').innerHTML=`
    <div class="task-row">
      <span class="task-badge">D4 &middot; Lab ${S.lab+1}</span>
      <div class="task-text">${lab.task}</div>
      <div class="task-acts">
        <button class="btn btn-gold" onclick="openResources(${S.lab})">&#128161; Resources</button>
        ${!done?`<button class="btn btn-ghost" onclick="showHint()" ${hintDis?'disabled style="opacity:.5"':''}>
          ${S.hintCount===0?'Hint':hintDis?'Hints Used':'Next Hint'}
        </button><button class="btn btn-ghost" onclick="resetLab()">Reset</button>`:''}
      </div>
    </div>
    ${hintsHtml}${fb}`;
}

window.showHint=function(){if(S.hintCount<(LABS[S.lab].hints||[]).length)S.hintCount++;renderTask();};
window.resetLab=function(){delete S.res[LABS[S.lab].id];S.wrongCount=0;S.hintCount=0;renderAll();};

function renderSidebar(){
  const ts=score();
  document.getElementById('sb-score').textContent=`${ts} / ${TOTAL}`;
  document.getElementById('sb-fill').style.width=`${(ts/TOTAL*100).toFixed(0)}%`;
  document.getElementById('prog-fill').style.width=`${(ts/TOTAL*100).toFixed(0)}%`;
  document.getElementById('sb-nav').innerHTML=LABS.map((l,li)=>{
    const done=!!S.res[l.id],act=li===S.lab;
    return`<button class="lab-btn${act?' active':''}${done?' done':''}" onclick="goLab(${li})">
      <span class="lab-dot${act?' active':''}${done?' done':''}">${done?'&#10003;':li+1}</span>
      <div><div class="lab-name">${l.name}</div></div>
    </button>`;
  }).join('');
}

function openResources(i){
  const lab=LABS[i];
  document.getElementById('res-skill-name').textContent=lab.name;
  document.getElementById('res-body').innerHTML=`
    <div class="res-card"><div class="res-card-hd"><div class="res-icon ri-ai">&#129302;</div><div><div class="res-card-title">AI Prompt</div><div class="res-card-sub">Copy to ChatGPT, Copilot, or Perplexity</div></div></div>
    <div class="res-card-body"><div class="prompt-box" id="prompt-text">${lab.prompt}</div><button class="copy-btn" id="copy-btn" onclick="copyPrompt()">&#128203; Copy Prompt</button></div></div>
    <div class="res-card"><div class="res-card-hd"><div class="res-icon ri-yt">&#9654;</div><div><div class="res-card-title">YouTube</div><div class="res-card-sub">Pre-built search for this skill</div></div></div>
    <div class="res-card-body"><a href="${lab.youtube}" target="_blank" class="res-link">&#128269; Search YouTube for "${lab.name}" <span>&#8599;</span></a><p class="res-note">Look for "Word 365" videos.</p></div></div>
    <div class="res-card"><div class="res-card-hd"><div class="res-icon ri-ms">&#128214;</div><div><div class="res-card-title">Microsoft Support</div><div class="res-card-sub">Official documentation</div></div></div>
    <div class="res-card-body"><a href="${lab.ms}" target="_blank" class="res-link">&#128196; Open Microsoft Support Article <span>&#8599;</span></a></div></div>`;
  document.getElementById('res-overlay').classList.add('open');
  document.getElementById('res-panel').classList.add('open');
}
function closeResources(){document.getElementById('res-overlay').classList.remove('open');document.getElementById('res-panel').classList.remove('open');}
function copyPrompt(){
  navigator.clipboard.writeText(document.getElementById('prompt-text').textContent).then(()=>{
    const btn=document.getElementById('copy-btn');btn.textContent='&#10003; Copied!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='&#128203; Copy Prompt';btn.classList.remove('copied');},2500);
  });
}

window.showFinal=function(){
  const ts=score(),pct=Math.round(ts/TOTAL*100);
  document.getElementById('doc-page').innerHTML=`
  <div style="text-align:center;padding:28px 0 16px">
    <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px">IS101 &middot; Word 365 &middot; Domain 4: References</div>
    <div style="font-size:60px;font-weight:800;color:${pct===100?'#15803d':pct>=70?'#d97706':'#dc2626'};line-height:1">${ts}<span style="font-size:30px;font-weight:400;color:#9ca3af"> / ${TOTAL}</span></div>
    <div style="font-size:14px;color:#6b7280;margin:8px 0 24px">${pct}% &mdash; ${pct===100?'Domain 4 complete! Only 2 domains left.':pct>=70?'Good &mdash; review missed labs.':'Keep practicing.'}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;max-width:420px;margin:0 auto;text-align:left">
      ${LABS.map(l=>{const ok=S.res[l.id];return`<div style="background:${ok?'#f0fdf4':'#fef2f2'};border:1px solid ${ok?'#86efac':'#fca5a5'};padding:7px 10px;border-radius:4px"><div style="font-size:9px;font-weight:700;text-transform:uppercase;color:${ok?'#15803d':'#dc2626'}">Lab ${l.id+1} ${ok?'&#10003;':'&#10007;'}</div><div style="font-size:11px;color:${ok?'#166534':'#991b1b'}">${l.name}</div></div>`;}).join('')}
    </div>
    <button class="btn btn-blue" style="margin-top:20px" onclick="goLab(0)">Restart Domain 4</button>
  </div>`;
  document.getElementById('task-panel').innerHTML='';
};

function renderRuler(){
  const r=document.getElementById('ruler'),mLeft=96,textW=680-mLeft-96,inchPx=textW/4.5;
  let html=`<div class="ruler-margin" style="width:${mLeft+30}px"></div><div style="flex:1;position:relative;height:100%;background:#fff">`;
  for(let i=0;i<=5;i++){const x=(i*inchPx).toFixed(1);html+=`<div class="ruler-tick" style="left:${x}px"><div class="rtline major"></div>${i>0&&i<5?`<span class="rtnum" style="left:${x}px">${i}</span>`:''}</div>`;if(i<5){const hx=((i+.5)*inchPx).toFixed(1);html+=`<div class="ruler-tick" style="left:${hx}px"><div class="rtline"></div></div>`;}}
  r.innerHTML=html+'</div><div class="ruler-margin" style="width:96px"></div>';
}

window.goLab=function(i){
  S.lab=i;S.wrongCount=0;S.hintCount=0;S.dd=null;
  S.tab='references'; // All D4 skills are on References tab
  renderAll();
};
function renderAll(){renderSidebar();buildRibbon();renderDoc();renderTask();}

// ── localStorage persistence ──────────────────────────────────────
const STORAGE_KEY = 'is101_word_d4_progress';

function saveProgress() {
  try {
    const nshe = localStorage.getItem('is101_nshe') || 'guest';
    const key = STORAGE_KEY + '_' + nshe;
    localStorage.setItem(key, JSON.stringify(S.res));
  } catch(e) {}
}

function loadSavedProgress() {
  try {
    const nshe = localStorage.getItem('is101_nshe') || 'guest';
    const key = STORAGE_KEY + '_' + nshe;
    const saved = localStorage.getItem(key);
    if (saved) {
      const parsed = JSON.parse(saved);
      // Restore completions
      Object.assign(S.res, parsed);
      // Jump to first incomplete lab
      const firstIncomplete = LABS.findIndex(l => !S.res[l.id]);
      if (firstIncomplete > 0) S.lab = firstIncomplete;
    }
  } catch(e) {}
}
// ─────────────────────────────────────────────────────────────────

renderRuler();
loadSavedProgress();
renderAll();
</script>
</body>
</html>
