  const dupDlg=!done&&state.skillAttempted[skill.id]?`

// ── Helpers ──
function buildGrid(rows,done){
  let html=`<div class="xl-grid-wrap"><table class="xl-grid"><thead><tr>
    <th class="xl-col-hdr select-all"></th>
    <th class="xl-col-hdr">A</th><th class="xl-col-hdr">B</th><th class="xl-col-hdr">C</th><th class="xl-col-hdr">D</th><th class="xl-col-hdr">E</th>
  </tr></thead><tbody>`;
  rows.forEach((row,ri)=>{
    const isHdr=ri===0;
    html+=`<tr><td class="xl-row-hdr">${ri+1}</td>`;
    row.forEach(cell=>{
      let txt=cell.toString().replace(/^\*\*/,'');
      let cls=done?(isHdr?'xl-cell tbl-hdr':'xl-cell '+(ri%2===0?'tbl-stripe':'tbl-row')):isHdr?'xl-cell bold':'xl-cell';
      html+=`<td class="${cls}">${txt}${done&&isHdr?'<span class="sort-arrow">▼</span>':''}</td>`;
    });
    html+=`</tr>`;
  });
  html+=`</tbody></table></div>`;
  return html;
}
function simShell(skillId,filename,activeTab,ribbonHtml,nameCell,formulaVal,gridHtml,extraOverlay='',sheets=['Bookings']){
  const tabs=['File','Home','Insert','Page Layout','Formulas','Data','Review','View'];
  return simShellCustomTabs(skillId,filename,tabs,activeTab,ribbonHtml,nameCell,formulaVal,gridHtml,extraOverlay,sheets);
}
function simShellCustomTabs(skillId,filename,tabs,activeTab,ribbonHtml,nameCell,formulaVal,gridHtml,extraOverlay,sheets){
  const sheetTabs=sheets.map((s,i)=>`<div class="xl-sheettab ${i===0?'active':''}">${s}</div>`).join('')+`<span class="xl-new-tab">⊕</span>`;
  const tabHtml=tabs.map(t=>{
    const isCtx=t==='Table Design';
    return `<div class="xl-tab ${t===activeTab?'active':''} ${isCtx?'contextual':''}">${t}</div>`;
  }).join('');
  return `<div class="excel-sim" id="sim_${skillId}">
  <div class="xl-titlebar"><span style="font-weight:600">${filename}</span><span class="xl-titlebar-app">Microsoft Excel</span></div>
  <div class="xl-ribbon">
    <div class="xl-tabs">${tabHtml}</div>
    <div class="xl-ribbon-content">${ribbonHtml}</div>
  </div>
  <div class="xl-formulabar">
    <input class="xl-namebox" value="${nameCell}" readonly>
    <span class="xl-fx-label">fx</span>
    <input class="xl-formulainput" value="${formulaVal}" readonly>
  </div>
  ${gridHtml}
  <div class="xl-sheettabs">${sheetTabs}</div>
  <div class="xl-statusbar"><span>Ready</span><span>100% 🔍</span></div>
  ${extraOverlay}
</div>`;
}

// ── Core ──
function markComplete(skillId){
  state.completedSkills.add(skillId);saveState();renderNav();renderSkillPanel();
  if(window.api&&window.api.saveLabAnswer)window.api.saveLabAnswer('e3_'+skillId,'completed',true).catch(()=>{});
  const idx=SKILLS.findIndex(s=>s.id===skillId);
  if(idx<SKILLS.length-1)setTimeout(()=>goSkill(idx+1),1200);
}
function showHint(skillId){
  const skill=SKILLS.find(s=>s.id===skillId);if(!skill)return;
  const hl=state.hintLevel[skillId]||0;if(hl>=3)return;
  state.hintLevel[skillId]=hl+1;const newHl=state.hintLevel[skillId];
  const box=document.getElementById(`hintBox_${skillId}`);
  if(box){box.innerHTML=`<strong>Hint ${newHl}:</strong> ${newHl===1?skill.hint1:newHl===2?skill.hint2:skill.hint3}`;box.classList.add('visible');}
  document.querySelectorAll('.btn-hint').forEach(b=>{if(b.closest('#skillPanel'))b.textContent=`💡 Hint (${newHl}/3)`;});
}
function toggleResources(skillId){
  state.resourcesOpen[skillId]=!state.resourcesOpen[skillId];
  const p=document.getElementById(`resPanel_${skillId}`);
  if(p)p.classList.toggle('open',state.resourcesOpen[skillId]);
}
function copyPrompt(skillId){
  const skill=SKILLS.find(s=>s.id===skillId);if(!skill)return;
  navigator.clipboard.writeText(skill.resources.ai).then(()=>alert('Prompt copied!')).catch(()=>prompt('Copy this:',skill.resources.ai));
}
function renderNavRow(){
  const idx=state.currentSkillIdx,skill=SKILLS[idx],done=state.completedSkills.has(skill.id);
  return `<div class="skill-nav-row">
    <button class="btn-nav secondary" onclick="goSkill(${idx-1})" ${idx===0?'disabled':''}>← Previous</button>
    <span class="skill-status-text">${done?'✅ Complete':'Skill '+skill.num+' of '+SKILLS.length}</span>
    <button class="btn-nav primary" onclick="goSkill(${idx+1})" ${idx===SKILLS.length-1?'disabled':''}>Next →</button>
  </div>`;
}

renderNav();
renderSkillPanel();
</script>
