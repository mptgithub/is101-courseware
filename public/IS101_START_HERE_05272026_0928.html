<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IS101 — Introduction to Computing | College of Southern Nevada</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --csn:#003876;--csn-dk:#002558;--csn-lt:#e8eef7;--csn-mid:#d0dced;
  --word:#2b579a;--word-dk:#1e3a8a;--word-lt:#e8f0fb;
  --excel:#217346;--excel-dk:#155c32;--excel-lt:#e0f0e8;
  --bg:#f0f2f5;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;
  --step1:#7c3aed;--step1-lt:#f5f3ff;--step1-bd:#c4b5fd;
  --step2:#0369a1;--step2-lt:#eff6ff;--step2-bd:#bfdbfe;
  --step3:#b45309;--step3-lt:#fffbeb;--step3-bd:#fde68a;
  --done:#15803d;--done-lt:#f0fdf4;--done-bd:#86efac;
  --locked:#94a3b8;--locked-lt:#f8fafc;--locked-bd:#e2e8f0;
}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* ── HEADER ── */
#header{background:var(--csn);flex-shrink:0}
.header-top{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid rgba(255,255,255,.12)}
.header-brand{display:flex;align-items:center;gap:14px}
.header-csn-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:4px;letter-spacing:.5px}
.header-course{color:#fff}
.header-course-code{font-size:11px;color:rgba(255,255,255,.65);font-weight:400;margin-bottom:1px}
.header-course-name{font-size:16px;font-weight:700;letter-spacing:-.2px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.student-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:6px 14px 6px 8px}
.student-pill .sp-avatar{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.student-pill input{background:transparent;border:none;font-size:12px;color:#fff;font-family:inherit;width:150px;outline:none}
.student-pill input::placeholder{color:rgba(255,255,255,.45)}

/* Unit nav tabs */
.unit-nav{display:flex;padding:0 28px;gap:2px}
.unit-nav-tab{padding:11px 20px;font-size:13px;font-weight:500;color:rgba(255,255,255,.65);border:none;background:transparent;cursor:pointer;font-family:inherit;border-bottom:3px solid transparent;transition:all .15s;display:flex;align-items:center;gap:7px;white-space:nowrap}
.unit-nav-tab:hover{color:#fff;background:rgba(255,255,255,.07)}
.unit-nav-tab.active{color:#fff;border-bottom-color:#fff;font-weight:600}
.unit-nav-tab .unt-icon{font-size:14px}

/* ── BODY ── */
#body{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
#sidebar{width:252px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-unit-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);padding:14px 18px 6px;display:flex;align-items:center;gap:6px}
.sb-unit-label .sul-icon{font-size:13px}
.sb-topic-btn{width:100%;background:transparent;border:none;border-left:3px solid transparent;padding:9px 18px;text-align:left;cursor:pointer;font-family:inherit;transition:all .12s;display:flex;align-items:center;gap:9px}
.sb-topic-btn:hover{background:#f8fafc}
.sb-topic-btn.active{background:var(--csn-lt);border-left-color:var(--csn)}
.sb-topic-btn .stb-num{font-size:10px;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#e2e8f0;color:var(--muted)}
.sb-topic-btn.word-topic .stb-num{background:var(--word-lt);color:var(--word)}
.sb-topic-btn.excel-topic .stb-num{background:var(--excel-lt);color:var(--excel)}
.sb-topic-btn.active .stb-num{background:var(--csn);color:#fff}
.sb-topic-btn .stb-name{font-size:12px;font-weight:500;color:var(--text);flex:1;text-align:left;line-height:1.3}
.sb-topic-btn .stb-status{font-size:13px;flex-shrink:0}
.sb-divider{height:1px;background:var(--border);margin:6px 0}
.sb-progress{padding:14px 18px;border-top:1px solid var(--border);margin-top:auto}
.sb-prog-lbl{font-size:10px;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between}
.sb-prog-bar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.sb-prog-fill{height:100%;border-radius:3px;background:var(--csn);transition:width .4s}

/* ── MAIN ── */
#main{flex:1;overflow-y:auto;padding:24px 28px}

/* ── TOPIC HERO ── */
.topic-hero{border-radius:12px;padding:20px 24px;margin-bottom:22px;display:flex;align-items:flex-start;gap:16px;justify-content:space-between}
.topic-hero.word-hero{background:linear-gradient(135deg,var(--word) 0%,#3b6cc4 100%)}
.topic-hero.excel-hero{background:linear-gradient(135deg,var(--excel) 0%,#2e9e5e 100%)}
.topic-hero.csn-hero{background:linear-gradient(135deg,var(--csn) 0%,#1a5cb0 100%)}
.th-unit-tag{font-size:10px;background:rgba(255,255,255,.2);color:#fff;padding:3px 10px;border-radius:20px;font-weight:600;margin-bottom:6px;display:inline-block}
.th-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:3px}
.th-desc{font-size:13px;color:rgba(255,255,255,.8);line-height:1.6;max-width:540px}
.th-right{text-align:right;flex-shrink:0}
.th-pct{font-size:30px;font-weight:800;color:#fff;line-height:1}
.th-pct-lbl{font-size:11px;color:rgba(255,255,255,.65);margin-top:2px}

/* ── LEARNING PATH CARDS ── */
.path-heading{font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.path-heading::after{content:'';flex:1;height:1px;background:var(--border)}
.learning-path{display:grid;grid-template-columns:1fr 38px 1fr 38px 1fr;align-items:stretch;margin-bottom:28px}
.path-arrow{display:flex;align-items:center;justify-content:center;padding-top:22px;font-size:20px;color:#d1d5db}

.step-card{border-radius:10px;border:2px solid;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s,transform .15s}
.step-card:hover:not(.locked){transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.step-card.locked{cursor:not-allowed;opacity:.65}

.step-card.step-1{border-color:var(--step1-bd);background:var(--step1-lt)}
.step-card.step-2{border-color:var(--step2-bd);background:var(--step2-lt)}
.step-card.step-3{border-color:var(--step3-bd);background:var(--step3-lt)}
.step-card.done{border-color:var(--done-bd);background:var(--done-lt)}
.step-card.locked{border-color:var(--locked-bd);background:var(--locked-lt)}

.step-hd{padding:12px 14px 10px;border-bottom:1px solid rgba(0,0,0,.06)}
.step-hd-row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.step-badge{width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-1 .step-badge{background:var(--step1);color:#fff}
.step-2 .step-badge{background:var(--step2);color:#fff}
.step-3 .step-badge{background:var(--step3);color:#fff}
.done .step-badge{background:var(--done);color:#fff}
.locked .step-badge{background:var(--locked);color:#fff}
.step-type-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.step-1 .step-type-lbl{color:var(--step1)}
.step-2 .step-type-lbl{color:var(--step2)}
.step-3 .step-type-lbl{color:var(--step3)}
.done .step-type-lbl{color:var(--done)}
.locked .step-type-lbl{color:var(--locked)}
.step-title{font-size:13px;font-weight:700;color:var(--text)}

.step-body{padding:10px 14px;flex:1}
.step-desc{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.step-checklist{display:flex;flex-direction:column;gap:3px}
.sc-item{font-size:11px;color:#374151;display:flex;align-items:flex-start;gap:5px;line-height:1.4}
.sc-dot{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;flex-shrink:0;margin-top:1px}
.sc-dot.done{background:var(--done);color:#fff}
.sc-dot.open{background:#dde3ea;color:#94a3b8}
.sc-dot.locked{background:#f1f5f9;color:#cbd5e1}

.step-ft{padding:10px 14px;border-top:1px solid rgba(0,0,0,.06)}
.step-launch-btn{width:100%;padding:8px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;transition:background .1s}
.step-1 .step-launch-btn{background:var(--step1);color:#fff}.step-1 .step-launch-btn:hover{background:#6d28d9}
.step-2 .step-launch-btn{background:var(--step2);color:#fff}.step-2 .step-launch-btn:hover{background:#075985}
.step-3 .step-launch-btn{background:var(--step3);color:#fff}.step-3 .step-launch-btn:hover{background:#92400e}
.done .step-launch-btn{background:var(--done);color:#fff}
.locked .step-launch-btn{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}

/* ── OVERVIEW GRID ── */
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ov-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .15s}
.ov-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.ov-hd{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.ov-num{width:26px;height:26px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ov-card.word-card .ov-num{background:var(--word-lt);color:var(--word)}
.ov-card.excel-card .ov-num{background:var(--excel-lt);color:var(--excel)}
.ov-name{font-size:13px;font-weight:600;color:var(--text);flex:1}
.ov-pct{font-size:12px;font-weight:700}
.ov-desc{padding:6px 15px 16px;font-size:11px solid var(--border)}
.ov-steps{display:flex;gap:3px;padding:10px 14px;align-items:center}
.ov-step{flex:1;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;gap:3px}
.ov-step.todo{background:#f1f5f9;color:#94a3b8}
.ov-step.done{background:var(--done-lt);color:var(--done)}
.ov-step.next{background:var(--step2-lt);color:var(--step2)}
.ov-step-arr{color:#d1d5db;font-size:11px}

/* ── HOW IT WORKS + WELCOME + APP CARDS ── */
.welcome{max-width:100%;margin:0 auto;text-align:center;padding:0}
.csn-welcome-logo{background:var(--csn);color:#fff;font-size:12px;font-weight:700;padding:6px 16px;border-radius:4px;display:inline-block;margin-bottom:14px;letter-spacing:.8px;text-transform:uppercase}
.welcome h1{font-size:32px;font-weight:800;color:var(--text);margin-bottom:6px}
.welcome .w-course{font-size:14px;font-weight:500;color:var(--muted);margin-bottom:10px}
.welcome p{font-size:14px;color:var(--muted);line-height:1.7;max-width:680px;margin:0 auto 28px}
.hiw-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:16px}
.hiw-row{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr;align-items:start;gap:0;margin-bottom:0}
.hiw-arrow{display:flex;align-items:center;justify-content:center;padding-top:52px;font-size:18px;color:#cbd5e1}
.mon-wrap{display:flex;flex-direction:column;align-items:center}
.mon-outer{width:100%;background:#1e293b;border-radius:10px 10px 0 0;padding:8px 8px 5px;border:3px solid #334155}
.mon-screen{border-radius:5px;overflow:hidden;min-height:110px;display:flex;flex-direction:column}
.mon-bar{height:20px;display:flex;align-items:center;gap:5px;padding:0 8px;flex-shrink:0}
.mon-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mon-dot.r{background:#f87171}
.mon-dot.y{background:#fbbf24}
.mon-dot.g{background:#4ade80}
.mon-body{flex:1;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 8px;gap:4px}
.mon-num{font-size:11px;font-weight:800;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase}
.mon-ico{font-size:26px;line-height:1}
.mon-lbl{font-size:13px;font-weight:700;color:#fff;text-align:center}
.mon-dsc{font-size:10px;color:rgba(255,255,255,.6);text-align:center;line-height:1.4}
.mon-neck{width:12px;height:10px;background:#334155;margin:0 auto}
.mon-base{width:50px;height:6px;background:#334155;border-radius:0 0 4px 4px;margin:0 auto}
.mon-tag{margin-top:6px;text-align:center;padding:0 4px}
.mon-tag-title{font-size:12px;font-weight:700;margin-bottom:2px}
.mon-tag-desc{font-size:10px;color:var(--muted);line-height:1.4}
.mon-s1 .mon-bar{background:#3b0764}
.mon-s1 .mon-tag-title{color:var(--step1)}
.mon-s2 .mon-bar{background:#0c2340}
.mon-s2 .mon-tag-title{color:var(--step2)}
.mon-s3 .mon-bar{background:#2d1a00}
.mon-s3 .mon-tag-title{color:var(--step3)}
.unit-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:16px}
.unit-app-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:100%;margin:0}
.unit-app-card{cursor:pointer;transition:all .18s;border-radius:10px;overflow:hidden;box-shadow:0 3px 16px rgba(0,0,0,.1)}
.unit-app-card:hover{transform:translateY(-4px);box-shadow:0 10px 32px rgba(0,0,0,.16)}
.app-titlebar{display:flex;align-items:center;gap:8px;padding:8px 12px}
.app-titlebar .app-ico{font-size:15px}
.app-titlebar .app-name{font-size:13px;font-weight:600;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-titlebar .app-btns{display:flex;gap:4px;flex-shrink:0}
.app-titlebar .ab{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3)}
.word-card .app-titlebar{background:var(--word)}
.excel-card .app-titlebar{background:var(--excel)}
.app-ribbon{display:flex;gap:0;border-bottom:1px solid rgba(0,0,0,.1)}
.app-ribbon-tab{font-size:9px;font-weight:600;padding:4px 9px;cursor:default;border-bottom:2px solid transparent}
.word-card .app-ribbon{background:#edf2fb}
.word-card .app-ribbon-tab{color:var(--word)}
.word-card .app-ribbon-tab.on{background:var(--word);color:#fff;border-bottom-color:var(--word)}
.excel-card .app-ribbon{background:#edf7f2}
.excel-card .app-ribbon-tab{color:var(--excel)}
.excel-card .app-ribbon-tab.on{background:var(--excel);color:#fff;border-bottom-color:var(--excel)}
.word-doc{padding:8px 14px;background:#fff;min-height:80px}
.wd-h1{height:10px;border-radius:2px;background:var(--word);width:65%;margin-bottom:10px}
.wd-ln{height:6px;border-radius:2px;background:#e2e8f0;margin-bottom:5px}
.wd-gap{height:8px}
.xl-fbar{display:flex;align-items:center;gap:6px;padding:3px 8px;background:#fff;border-bottom:1px solid #c8e0d0;font-size:9px;color:#666}
.xl-nbox{background:#edf7f2;border:1px solid #b8dcc8;border-radius:2px;padding:1px 6px;font-size:9px;font-weight:700;color:var(--excel)}
.xl-grid{display:grid;grid-template-columns:24px repeat(4,1fr)}
.xl-ch{background:#edf7f2;border-right:1px solid #c8e0d0;border-bottom:2px solid var(--excel);padding:2px;font-size:7px;font-weight:700;color:var(--excel);text-align:center}
.xl-rh{background:#edf7f2;border-right:2px solid var(--excel);border-bottom:1px solid #c8e0d0;padding:3px;font-size:8px;font-weight:700;color:var(--excel);text-align:center}
.xl-c{border-right:1px solid #d8eee4;border-bottom:1px solid #d8eee4;padding:2px 4px;font-size:7px;color:#1e293b;background:#fff}
.xl-c.hd{background:#edf7f2;font-weight:700;color:var(--excel)}
.xl-c.n{text-align:right;color:#0369a1}
.xl-c.f{background:#fffbeb;color:#92400e;text-align:right}
.xl-c.sel{background:#d8f0e4;outline:2px solid var(--excel)}
.xl-tabs{background:#d8f0e4;padding:3px 6px;display:flex;gap:3px}
.xl-tab{font-size:8px;font-weight:600;padding:2px 7px;border-radius:3px 3px 0 0;background:#fff;color:var(--excel);border:1px solid #b8dcc8}
.xl-tab.on{background:var(--excel);color:#fff;border-color:var(--excel)}
.app-footer{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-top:1px solid rgba(0,0,0,.08)}
.word-card .app-footer{background:#edf2fb}
.excel-card .app-footer{background:#edf7f2}
.app-footer-info{text-align:left}
.app-footer-unit{font-size:13px;font-weight:700}
.word-card .app-footer-unit{color:var(--word)}
.excel-card .app-footer-unit{color:var(--excel)}
.app-footer-sub{font-size:11px;color:var(--muted)}
.app-footer-btn{font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;color:#fff;border:none;cursor:pointer}
.word-card .app-footer-btn{background:var(--word)}
.excel-card .app-footer-btn{background:var(--excel)}

/* ── MODAL ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:none;align-items:center;justify-content:center}
.modal-backdrop.open{display:flex}
.modal{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:93vw;max-width:1100px;height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal-hd{background:#1e293b;padding:11px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-hd .mh-crumb{font-size:11px;color:#94a3b8}
.modal-hd .mh-title{font-size:13px;font-weight:600;color:#fff;flex:1}
.modal-hd .mh-done{background:#15803d;border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;border-radius:6px;padding:6px 14px;font-family:inherit}
.modal-hd .mh-done:hover{background:#166534}
.modal-hd .mh-done.already{background:#64748b}
.modal-hd .mh-close{background:rgba(255,255,255,.12);border:none;color:#fff;cursor:pointer;border-radius:6px;width:28px;height:28px;font-size:16px;display:flex;align-items:center;justify-content:center}
.modal-hd .mh-close:hover{background:rgba(255,255,255,.22)}
.modal-body{flex:1;overflow:hidden}
.modal-body iframe{width:100%;height:100%;border:none}

/* ── NAV ROW ── */
.topic-nav-row{display:flex;justify-content:space-between;margin-top:18px}
.nav-btn{background:#fff;border:1px solid var(--border);padding:10px 20px 16px;border-radius:6px;font-size:13px .1s}
.nav-btn:hover{background:#f8fafc}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;right:22px;background:#1e293b;color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;transform:translateY(80px);opacity:0;transition:all .3s;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:340px;line-height:1.4}
.toast.show{transform:translateY(0);opacity:1}

/* ═══════════════════════════════════════════════════════
   SPLASH SCREEN — Digital Classroom Theme
   ═══════════════════════════════════════════════════════ */

/* Main background when splash is active */
#main.splash-active {
  background: #071220;
  overflow-y: auto;
  padding: 0;
}

/* Photo background with dark overlay — computer classroom, barely visible */
.splash-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  /* Layer 1: dark overlay  Layer 2: classroom photo */
  background:
    linear-gradient(rgba(5,14,26,.75), rgba(5,14,26,.75)),
    url('https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=1920&q=70') center/cover no-repeat;
  /* Circuit grid on top of photo */
  background-image:
    linear-gradient(rgba(5,14,26,.75), rgba(5,14,26,.75)),
    url('https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=1920&q=70');
  background-size: cover;
  background-position: center;
}

/* Animated circuit-grid overlay on top of the photo */
.splash-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:

    rgba(0,180,255,.04) 60%,
    transparent 100%

  background-size: 100% 400%;
  animation: scanLine 6s ease-in-out infinite;

  0%   { background-position: 0 -100%; }
  100% { background-position: 0 200%; }

.splash-frame::after {
  content: '';

  width: 28px;
  height: 28px;
  border-color: #00b4ff;
  border-style: solid;
}
.splash-frame::before {
  top: -3px; left: -3px;
  border-width: 3px 0 0 3px;
  border-radius: 8px 0 0 0;
}
.splash-frame::after {
  bottom: -3px; right: -3px;
  border-width: 0 3px 3px 0;
  border-radius: 0 0 8px 0;
}

  position: fixed;

  border-radius: 0 8px 0 0;

.splash-corner-bl {

  border-left: 3px solid #00b4ff;

// STATE & PERSISTENCE

let S = { unit: null, topic: null };

const key = (topicId, stepIdx) => `is101-${topicId}-step${stepIdx}`;
const isDone = (topicId, stepIdx) => !!localStorage.getItem(key(topicId, stepIdx));
const markDoneLS = (topicId, stepIdx) => localStorage.setItem(key(topicId, stepIdx), '1');
const isUnlocked = (topic, stepIdx) => stepIdx === 0 || isDone(topic.id, stepIdx - 1);

function topicProgress(topic){ return topic.steps.filter((_,i) => isDone(topic.id, i)).length; }
function unitProgress(unit){
  const total = unit.topics.length * 3;
  const done = unit.topics.reduce((s,t) => s + topicProgress(t), 0);
  return { done, total, pct: Math.round(done / total * 100) };
}
function overallProgress(){
  const all = UNITS.flatMap(u => u.topics);
  const done = all.reduce((s,t) => s + topicProgress(t), 0);
  return { done, total: all.length * 3 };
}

function render(){
  renderUnitNav();
  if (!S.unit){ renderWelcome(); document.getElementById('sidebar').innerHTML = ''; return; }
  renderSidebar();
  if (!S.topic || S.topic === 'overview') renderOverview();
  else renderTopic();
}

function renderUnitNav(){
  document.getElementById('unit-nav').innerHTML =
    `<button class="unit-nav-tab${!S.unit?' active':''}" onclick="selectUnit(null)"><span class="unt-icon">🏠</span>Home</button>` +
    UNITS.map(u =>
      `<button class="unit-nav-tab${S.unit===u.id?' active':''}" onclick="selectUnit('${u.id}')">
        <span class="unt-icon">${u.icon}</span>${u.number}: ${u.name}
      </button>`
    ).join('');
}

function renderSidebar(){
  const unit = UNITS.find(u => u.id === S.unit);
  if (!unit){ document.getElementById('sidebar').innerHTML = ''; return; }
  const up = unitProgress(unit);
  let html = `<div class="sb-unit-label"><span class="sul-icon">${unit.icon}</span>${unit.number} — ${unit.name}</div>`;
  html += `<button class="sb-topic-btn${S.topic==='overview'?' active':''}" onclick="selectTopic('overview')">
    <div class="stb-num" style="background:${S.unit==='word'?'var(--word-lt)':'var(--excel-lt)'};color:${S.unit==='word'?'var(--word)':'var(--excel)'}">≡</div>
    <div class="stb-name">All Topics</div>
    <div class="stb-status" style="color:var(--muted);font-size:11px">${up.pct}%</div>
  </button>`;
  html += `<div class="sb-divider"></div>`;
  unit.topics.forEach(t => {
    const dp = topicProgress(t);
    const status = dp===3?'✅':dp>0?'⏳':'○';
    const active = S.topic === t.id;
    html += `<button class="sb-topic-btn ${unit.id}-topic${active?' active':''}" onclick="selectTopic('${t.id}')">
      <div class="stb-num">${t.num}</div>
      <div class="stb-name">${t.name}</div>
      <div class="stb-status">${status}</div>
    </button>`;
  });
  html += `<div class="sb-progress">
    <div class="sb-prog-lbl"><span>${unit.number} Progress</span><span>${up.done}/${up.total} steps</span></div>
    <div class="sb-prog-bar"><div class="sb-prog-fill" style="width:${up.pct}%;background:${S.unit==='word'?'var(--word)':'var(--excel)'}"></div></div>
  </div>`;
  document.getElementById('sidebar').innerHTML = html;
}

}

function renderOverview(){
  const unit = UNITS.find(u => u.id === S.unit);
  const up = unitProgress(unit);
  const pctColor = up.pct===100?'#4ade80':up.pct>0?'#fbbf24':'rgba(255,255,255,.5)';
  const appName = unit.id==='word'?'Microsoft Word 365':'Microsoft Excel 365';
  const labType = unit.id==='word'?'simulated Word ribbon labs':'simulated Excel formula labs';

  let html = `
  <!-- ── UNIT INTRO BANNER ── -->
  <div class="unit-intro-banner ${unit.id}-hero">

    <div class="uib-hero">
      <div class="uib-left">
        <div class="uib-tag">${unit.number} &mdash; ${unit.topics.length} Topics</div>
        <div class="uib-title">${unit.icon} ${unit.name}</div>
        <div class="uib-subtitle">
          This unit has <strong style="color:#fff">${unit.topics.length} topics</strong> — work through them in order.
          Each topic follows the same three-step path: learn first, then practice, then prove it with a real project.
          Click any topic below to begin.
        </div>
      </div>
      <div class="uib-right">
        <div class="uib-pct" style="color:${pctColor}">${up.pct}%</div>
        <div class="uib-pct-lbl">${up.done} of ${up.total} steps done</div>
      </div>
    </div>

    <div class="uib-steps">
      <div class="uib-step uib-s1">
        <div class="uib-step-num">1</div>
        <div class="uib-step-body">
          <div class="uib-step-title">&#128065; Learn — Watch Videos &amp; Read</div>
          <div class="uib-step-desc">
            Before touching the keyboard, explore each skill using AI prompts, LinkedIn Learning videos,
            YouTube tutorials, and official Microsoft Support articles.
            You choose how you learn best.
          </div>
        </div>
      </div>
      <div class="uib-step uib-s2">
        <div class="uib-step-num">2</div>
        <div class="uib-step-body">
          <div class="uib-step-title">&#9000;&#65039; Practice — Complete the Simulated Labs</div>
          <div class="uib-step-desc">
            Work through ${labType} that let you practice every skill hands-on.
            The simulator gives you instant feedback so you know immediately whether
            you performed each action correctly. This is not multiple choice.
          </div>
        </div>
      </div>
      <div class="uib-step uib-s3">
        <div class="uib-step-num">3</div>
        <div class="uib-step-body">
          <div class="uib-step-title">&#128193; Prove It — Live Project in ${appName}</div>
          <div class="uib-step-desc">
            Complete a real project on your own computer inside ${appName}, then upload your file for automatic grading.
            This is the real deal &mdash; it shows you have truly mastered the concepts.
          </div>
          <div class="uib-step-badge">&#127381; Must score 100% &mdash; unlimited attempts. Good luck!</div>
        </div>
      </div>
    </div>

  </div>

  <!-- ── TOPIC GRID ── -->
  <div class="uib-topics-hd">
    <div class="uib-topics-hd-text">Select a topic to begin</div>
    <div class="uib-topics-hd-sub">${unit.topics.length} topics &mdash; complete in order</div>
    <div class="uib-topics-hd-line"></div>
  </div>
  <div class="overview-grid">`;

  unit.topics.forEach(t => {
    const dp = topicProgress(t);
    const pct = Math.round(dp/3*100);
    const pctColor = dp===3?'var(--done)':dp>0?'var(--step2)':'var(--muted)';
    html += `<div class="ov-card ${unit.id}-card" onclick="selectTopic('${t.id}')">
      <div class="ov-hd">
        <div class="ov-num">${t.num}</div>
        <div class="ov-name">${t.name}</div>
        <div class="ov-pct" style="color:${pctColor}">${pct}%</div>
      </div>
      <div class="ov-desc">${t.desc}</div>
      <div class="ov-steps">
        ${t.steps.map((step,i)=>{
          const done=isDone(t.id,i);
          const unlocked=isUnlocked(t,i);
          const icons=['&#128065;','&#9000;&#65039;','&#128193;'];
          const cls=done?'done':unlocked?'next':'todo';
          return '<div class="ov-step '+cls+'">'+( done?'&#9989;':icons[i])+' '+step.label+'</div>'+(i<2?'<div class="ov-step-arr">&#8250;</div>':'');
        }).join('')}
      </div>
    </div>`;
  });

  html += `</div>`;
  document.getElementById('main').innerHTML = html;
}

function renderTopic(){
  const unit = UNITS.find(u => u.id === S.unit);
  const topic = unit.topics.find(t => t.id === S.topic);
  if (!topic){ renderOverview(); return; }
  const dp = topicProgress(topic);
  const pct = Math.round(dp/3*100);

  let html = `
  <div class="topic-hero ${unit.id}-hero">
    <div>
      <div class="th-unit-tag">${unit.number} · Topic ${topic.num}</div>
      <div class="th-title">${topic.name}</div>
      <div class="th-desc">${topic.desc}</div>
    </div>
    <div class="th-right">
      <div class="th-pct" style="color:${dp===3?'#4ade80':dp>0?'#fbbf24':'rgba(255,255,255,.5)'}">${pct}%</div>
      <div class="th-pct-lbl">${dp}/3 steps done</div>
    </div>
  </div>
  <div class="path-heading">Complete these 3 steps in order</div>
  <div class="learning-path">`;

  const stepColors = ['step-1','step-2','step-3'];
  const stepIcons = ['👁','⌨','📁'];

  topic.steps.forEach((step, i) => {
    const done = isDone(topic.id, i);
    const unlocked = isUnlocked(topic, i);
    const cardCls = done ? `step-card done ${stepColors[i]}` : unlocked ? `step-card ${stepColors[i]}` : `step-card locked`;

    if (i > 0) html += `<div class="path-arrow">${done?'✅':'›'}</div>`;

    html += `<div class="${cardCls}" onclick="${unlocked?`openStep('${topic.id}',${i})`:'lockedToast()'}">
      <div class="step-hd">
        <div class="step-hd-row">
          <div class="step-badge">${done?'✓':i+1}</div>
          <div class="step-type-lbl">${step.label}</div>
        </div>
        <div class="step-title">${stepIcons[i]} ${step.title}</div>
      </div>
      <div class="step-body">
        <div class="step-desc">${step.desc}</div>
        <div class="step-checklist">
          ${step.checklist.map(item=>`<div class="sc-item">
            <div class="sc-dot ${done?'done':unlocked?'open':'locked'}">${done?'✓':'·'}</div>
            ${item}
          </div>`).join('')}
        </div>
      </div>
      <div class="step-ft">
        <button class="step-launch-btn" ${!unlocked?'disabled':''} onclick="event.stopPropagation();${unlocked?`openStep('${topic.id}',${i})`:'lockedToast()'}">
          ${done?`✅ Completed — Open Again`:`${stepIcons[i]} ${['Open Video Lessons','Open Practice Labs','Open Project Grader'][i]}`}
        </button>
      </div>
    </div>`;
  });

  html += `</div>`;

  const topics = unit.topics;
  const idx = topics.findIndex(t => t.id === topic.id);
  const prev = topics[idx-1];
  const next = topics[idx+1];

  html += `<div class="topic-nav-row">
    <button class="nav-btn" onclick="${prev?`selectTopic('${prev.id}')`:`selectTopic('overview')`}">
      ← ${prev?`Topic ${prev.num}: ${prev.name}`:'Back to All Topics'}
    </button>
    <button class="nav-btn" onclick="${next?`selectTopic('${next.id}')`:`selectTopic('overview')`}">
      ${next?`Topic ${next.num}: ${next.name} →`:'Back to All Topics'}
    </button>
  </div>`;

  document.getElementById('main').innerHTML = html;
}

// ═══════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════
window.selectUnit = function(id){
  S.unit = id; S.topic = id ? 'overview' : null;
  document.getElementById('main').classList.remove('splash-active');
  document.getElementById('sidebar').style.display = '';
  render();
};
window.selectTopic = function(id){ S.topic = id; render(); document.getElementById('main').scrollTo(0,0); };

window.openStep = function(topicId, stepIdx){
  const unit = UNITS.find(u => u.topics.some(t => t.id === topicId));
  const topic = unit.topics.find(t => t.id === topicId);
  const step = topic.steps[stepIdx];
  if (!step) return;

  const done = isDone(topicId, stepIdx);
  const stepLabels = ['Video Lesson','Practice Labs','Graded Project'];

  document.getElementById('modal-crumb').textContent = `${unit.number} · Topic ${topic.num}`;
  document.getElementById('modal-title').textContent = `${stepLabels[stepIdx]}: ${step.title}`;

  const doneBtn = document.getElementById('modal-done-btn');
  doneBtn.textContent = done ? '✅ Completed' : '✓ Mark Complete';
  doneBtn.className = `mh-done${done?' already':''}`;

  // Store context for markStepDone
  window._modalCtx = { topicId, stepIdx };

  let url = step.file;
  if (step.anchor) url += `#${step.anchor}`;
  document.getElementById('modal-iframe').src = url;
  document.getElementById('modal-backdrop').classList.add('open');
};

window.markStepDone = function(){
  const ctx = window._modalCtx;
  if (!ctx) return;
  markDoneLS(ctx.topicId, ctx.stepIdx);
  const btn = document.getElementById('modal-done-btn');
  btn.textContent = '✅ Completed';
  btn.className = 'mh-done already';
  toast('✅ Step marked complete! The next step is now unlocked.');
  render();
};

window.closeModal = function(){
  document.getElementById('modal-backdrop').classList.remove('open');
  document.getElementById('modal-iframe').src = '';
  window._modalCtx = null;
  render();
};

window.lockedToast = function(){
  toast('🔒 Finish the previous step first — then this step will unlock.');
};

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 3800);
}

window.updateName = function(val){
  const initials = val.trim().split(/\s+/).map(w=>w[0]?.toUpperCase()||'').join('').slice(0,2) || '?';
  document.getElementById('avatar').textContent = initials;
  localStorage.setItem('is101-student-name', val);
};

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
const savedName = localStorage.getItem('is101-student-name') || '';
if (savedName){ document.getElementById('student-name').value = savedName; window.updateName(savedName); }
render();
</script>
