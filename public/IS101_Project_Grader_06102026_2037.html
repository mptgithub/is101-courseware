<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IS101 — Project Grader</title>
<style>
:root {
  --navy:#1e293b; --blue:#2563eb; --blue-lt:#eff6ff; --blue-bd:#bfdbfe;
  --green:#16a34a; --green-lt:#f0fdf4; --green-bd:#bbf7d0;
  --orange:#d97706; --orange-lt:#fffbeb; --orange-bd:#fde68a;
  --red:#dc2626; --red-lt:#fef2f2; --red-bd:#fecaca;
  --purple:#7c3aed; --purple-lt:#f5f3ff; --purple-bd:#ddd6fe;
  --gray:#6b7280; --border:#e5e7eb; --muted:#9ca3af;
  --word-blue:#2b579a; --xl-green:#217346;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh;display:flex;flex-direction:column}

/* Nav */
#nav{background:var(--navy);padding:0 24px;display:flex;align-items:center;gap:12px;height:52px;flex-shrink:0}
#nav .logo{font-size:15px;font-weight:700;color:#fff}
#nav .logo span{color:#60a5fa}
#nav .breadcrumb{font-size:12px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:16px}
#nav .breadcrumb button{background:transparent;border:none;color:#60a5fa;cursor:pointer;font-size:12px;font-family:inherit}
#nav .breadcrumb button:hover{text-decoration:underline}
#nav .spacer{flex:1}
#nav .student-info{display:flex;align-items:center;gap:8px}
#nav input{background:#334155;border:1px solid #475569;color:#e2e8f0;padding:5px 10px;border-radius:4px;font-size:12px;font-family:inherit;width:160px}
#nav input::placeholder{color:#94a3b8}
#nav .btn-back{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 12px;border-radius:4px;font-size:12px;cursor:pointer;text-decoration:none}

/* Main */
#main{flex:1;padding:24px;max-width:1000px;margin:0 auto;width:100%}

/* Home screen */
.home-header{text-align:center;margin-bottom:32px}
.home-header h1{font-size:26px;font-weight:700;margin-bottom:8px}
.home-header p{font-size:14px;color:var(--gray);max-width:580px;margin:0 auto}
.unit-section{margin-bottom:32px}
.unit-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px;padding-left:4px}
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px}
.project-card{background:#fff;border:2px solid var(--border);border-radius:10px;padding:20px;cursor:pointer;transition:all .15s;position:relative}
.project-card:hover{border-color:#93c5fd;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.project-card.word-card:hover{border-color:var(--word-blue)}
.project-card.xl-card:hover{border-color:var(--xl-green)}
.card-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.badge-word{background:#e8f0fb;color:var(--word-blue)}
.badge-xl{background:#e9f5ee;color:var(--xl-green)}
.badge-core{background:#fef3c7;color:#92400e}
.badge-var{background:#f3e8ff;color:#6b21a8}
.card-title{font-size:16px;font-weight:700;margin-bottom:4px}
.card-scenario{font-size:12px;color:var(--gray);line-height:1.5;margin-bottom:12px}
.card-meta{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--muted)}
.card-pts{font-size:13px;font-weight:700;color:var(--green)}
.card-choice{position:absolute;top:16px;right:16px;font-size:10px;font-weight:700;color:var(--muted);background:#f8fafc;border:1px solid var(--border);padding:2px 8px;border-radius:10px}
.or-divider{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:11px;font-weight:700;color:var(--muted)}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* Project view */
.project-header{background:#fff;border-radius:10px;padding:24px;margin-bottom:20px;border:1px solid var(--border)}
.project-header .ph-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ph-title{font-size:20px;font-weight:700;margin-bottom:4px}
.ph-scenario{font-size:13px;color:var(--gray);line-height:1.6;max-width:680px}
.ph-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ph-score-box{text-align:right;flex-shrink:0}
.ph-score-big{font-size:36px;font-weight:800;line-height:1;color:var(--navy)}
.ph-score-label{font-size:11px;color:var(--muted);margin-top:2px}
.ph-score-bar{width:140px;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-top:6px;margin-left:auto}
.ph-score-fill{height:100%;border-radius:4px;background:var(--green);transition:width .4s ease}

/* Starter file download box */
.starter-box{background:var(--blue-lt);border:1.5px solid var(--blue-bd);border-radius:8px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.starter-box .sb-icon{font-size:28px;flex-shrink:0}
.starter-box .sb-text{flex:1}
.starter-box .sb-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:2px}
.starter-box .sb-desc{font-size:12px;color:var(--gray)}
.btn-download{background:var(--blue);color:#fff;border:none;padding:8px 18px;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.btn-download:hover{background:#1d4ed8}
.btn-download.word{background:var(--word-blue)}
.btn-download.word:hover{background:#1e3f6f}
.btn-download.excel{background:var(--xl-green)}
.btn-download.excel:hover{background:#185a35}

/* Upload zone */
.upload-section{background:#fff;border-radius:10px;padding:20px;margin-bottom:20px;border:1px solid var(--border)}
.upload-section h3{font-size:14px;font-weight:700;margin-bottom:12px}
.upload-zone{border:2px dashed var(--border);border-radius:8px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .15s;background:#fafafa}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--blue);background:var(--blue-lt)}
.upload-zone .uz-icon{font-size:32px;margin-bottom:8px}
.upload-zone .uz-title{font-size:13px;font-weight:600;color:#374151;margin-bottom:4px}
.upload-zone .uz-sub{font-size:11px;color:var(--muted)}
.upload-zone.has-file{border-color:var(--green);background:var(--green-lt)}
.upload-zone.has-file .uz-title{color:var(--green)}

/* Recording requirement box */
.recording-box{background:var(--orange-lt);border:1.5px solid var(--orange-bd);border-radius:8px;padding:14px 18px;margin-bottom:20px}
.recording-box .rb-title{font-size:13px;font-weight:700;color:#92400e;margin-bottom:6px}
.recording-box .rb-text{font-size:12px;color:#78350f;line-height:1.6}
.recording-box .rb-steps{margin:8px 0 0 16px;font-size:12px;color:#78350f;line-height:1.8}

/* Rubric */
.rubric-section{background:#fff;border-radius:10px;padding:20px;margin-bottom:20px;border:1px solid var(--border)}
.rubric-section h3{font-size:14px;font-weight:700;margin-bottom:4px}
.rubric-section .rs-meta{font-size:12px;color:var(--muted);margin-bottom:14px}
.domain-block{margin-bottom:20px}
.domain-header-row{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:8px 14px;margin-bottom:8px}
.domain-header-row .dh-name{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px}
.domain-header-row .dh-pts{font-size:12px;font-weight:700;color:var(--blue)}
.rubric-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:6px;border:1px solid var(--border);background:#fff;margin-bottom:6px;transition:background .1s}
.rubric-item:hover{background:#f8fafc}
.rubric-item.marked-full{background:var(--green-lt);border-color:var(--green-bd)}
.rubric-item.marked-partial{background:var(--orange-lt);border-color:var(--orange-bd)}
.rubric-item.marked-zero{background:var(--red-lt);border-color:var(--red-bd)}
.ri-num{font-size:11px;font-weight:700;color:var(--muted);width:20px;flex-shrink:0;padding-top:1px}
.ri-desc{flex:1;font-size:13px;line-height:1.4}
.ri-skill{font-size:10px;color:var(--muted);font-family:monospace;margin-top:2px}
.ri-pts-area{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.ri-pts-label{font-size:11px;color:var(--muted)}
.ri-score-btns{display:flex;gap:4px}
.ri-btn{width:32px;height:28px;border-radius:4px;border:1.5px solid var(--border);background:#f8fafc;font-size:11px;font-weight:700;cursor:pointer;transition:all .1s;color:var(--gray)}
.ri-btn:hover{border-color:#999}
.ri-btn.active-full{background:var(--green);border-color:var(--green);color:#fff}
.ri-btn.active-partial{background:var(--orange);border-color:var(--orange);color:#fff}
.ri-btn.active-zero{background:var(--red);border-color:var(--red);color:#fff}

/* Score bar bottom */
.score-summary{background:#fff;border-radius:10px;padding:20px;margin-bottom:20px;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.ss-grade{text-align:center}
.ss-grade .big{font-size:48px;font-weight:800;line-height:1}
.ss-grade .label{font-size:12px;color:var(--muted);margin-top:2px}
.ss-domains{display:flex;gap:12px;flex-wrap:wrap;flex:1;justify-content:center}
.ss-domain-box{background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:10px 14px;text-align:center;min-width:80px}
.ss-domain-box .d-name{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.ss-domain-box .d-score{font-size:18px;font-weight:700;color:var(--navy)}
.ss-domain-box .d-max{font-size:10px;color:var(--muted)}
.ss-actions{display:flex;flex-direction:column;gap:8px}
.btn-scoresheet{background:var(--navy);color:#fff;border:none;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.btn-scoresheet:hover{background:#0f172a}
.btn-reset{background:#f8fafc;border:1px solid var(--border);color:var(--gray);padding:8px 20px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-reset:hover{background:#f1f5f9}

/* Scoresheet modal */
#ss-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px}
#ss-modal.open{display:flex}
.ss-inner{background:#fff;border-radius:10px;max-width:780px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ss-modal-header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:10px 10px 0 0}
.ss-modal-header h3{font-size:15px;font-weight:700}
.ss-modal-actions{display:flex;gap:8px}
.ss-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:4px;font-size:12px;cursor:pointer;font-weight:600}
.ss-btn:hover{background:rgba(255,255,255,.25)}
#scoresheet-content{padding:20px;font-size:12px}

/* Scoresheet print styles */
.ss-header{border-bottom:3px solid var(--navy);padding-bottom:14px;margin-bottom:18px}
.ss-institution{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gray);margin-bottom:4px}
.ss-doc-title{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:2px}
.ss-subtitle{font-size:13px;color:#4b5563}
.ss-meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--border);margin-bottom:18px}
.ss-meta-cell{padding:8px 12px;border-right:1px solid var(--border)}
.ss-meta-cell:last-child{border-right:none}
.ss-meta-label{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:2px}
.ss-meta-value{font-size:13px;font-weight:600;color:#1f2937}
.ss-rubric-table{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:12px}
.ss-rubric-table th{background:var(--navy);color:#fff;padding:7px 10px;text-align:left;font-size:11px}
.ss-rubric-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.ss-rubric-table tr:nth-child(even) td{background:#f9fafb}
.ss-totals{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px}
.ss-total-box{border:2px solid var(--navy);padding:14px;text-align:center}
.ss-total-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gray);margin-bottom:4px}
.ss-total-score{font-size:32px;font-weight:800}
.ss-total-grade{font-size:20px;font-weight:700;margin-top:4px}
.ss-grade-scale{border:1px solid var(--border);padding:10px 14px}
.ss-grade-scale-title{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px}
.ss-grade-row{display:flex;justify-content:space-between;font-size:11px;color:#374151;padding:2px 0;border-bottom:1px solid #f3f4f6}
.ss-canvas-note{background:var(--orange-lt);border:1px solid var(--orange-bd);padding:12px 14px;margin-bottom:16px}
.ss-canvas-note-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#92400e;margin-bottom:4px}
.ss-canvas-note-text{font-size:11px;color:#78350f;line-height:1.55}
.ss-signature{border-top:1px solid var(--border);padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:11px;color:var(--gray)}
.ss-sig-line{border-bottom:1px solid var(--navy);height:24px;margin-bottom:4px}
.ss-footer{text-align:center;font-size:9px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;margin-top:16px}

@media(max-width:640px){.project-grid{grid-template-columns:1fr}.ss-meta-grid{grid-template-columns:1fr}.ss-totals{grid-template-columns:1fr}}
</style>
</head>

let currentView = 'home';

function getScore(projectId, taskNum) { return scores[`${projectId}_${taskNum}`] || 'none'; }
function setScore(projectId, taskNum, val) { scores[`${projectId}_${taskNum}`] = val; }

function calcProjectScore(p) {
  let earned = 0, total = p.totalPts;
  p.domains.forEach(d => d.tasks.forEach(t => {
    const s = getScore(p.id, t.num);
    if (s === 'full') earned += t.pts;
    else if (s === 'partial') earned += Math.floor(t.pts / 2);
  }));
  return { earned, total, pct: Math.round((earned/total)*100) };
}

function letterGrade(pct) {
  if (pct >= 90) return { letter:'A', color:'#16a34a' };
  if (pct >= 80) return { letter:'B', color:'#2563eb' };
  if (pct >= 70) return { letter:'C', color:'#d97706' };
  if (pct >= 60) return { letter:'D', color:'#ea580c' };
  return { letter:'F', color:'#dc2626' };
}

function markTask(projectId, taskNum, val, pts) {
  const current = getScore(projectId, taskNum);
  setScore(projectId, taskNum, current === val ? 'none' : val);
  renderProject();
}

function resetProject() {
  if (!confirm('Reset all scores for this project?')) return;
  currentProject.domains.forEach(d => d.tasks.forEach(t => setScore(currentProject.id, t.num, 'none')));
  renderProject();
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (file) { uploadedFile = file; renderProject(); }
}
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadZone').classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) { uploadedFile = file; renderProject(); }
}

function nav(view) { currentView = view; if(view==='home') currentProject = null; render(); window.scrollTo(0,0); }

function updateBreadcrumb(items) {
  const bc = document.getElementById('breadcrumb');

  items.forEach(item => { html += `<span>›</span><span style="color:#e2e8f0">${item.label}</span>`; });
  bc.innerHTML = html;
}

      <div class="ss-meta-cell"><div class="ss-meta-label">Date Graded</div><div class="ss-meta-value">${date}</div></div>
    </div>
    <table class="ss-rubric-table">
      <thead><tr><th>#</th><th>Task Description</th><th>Skill</th><th>Max</th><th>Score</th></tr></thead>
      <tbody>${rubricRows}</tbody>
    </table>
    <div class="ss-totals">
      <div class="ss-total-box">
        <div class="ss-total-label">Final Score</div>
        <div class="ss-total-score" style="color:${lg.color}">${earned} / ${total}</div>
        <div class="ss-total-grade" style="color:${lg.color}">${pct}% · Grade ${lg.letter}</div>
      </div>
      <div class="ss-grade-scale">
        <div class="ss-grade-scale-title">Grade Scale</div>
        <div class="ss-grade-row"><span>A</span><span>90–100%</span></div>
        <div class="ss-grade-row"><span>B</span><span>80–89%</span></div>
        <div class="ss-grade-row"><span>C</span><span>70–79%</span></div>
        <div class="ss-grade-row"><span>D</span><span>60–69%</span></div>
        <div class="ss-grade-row"><span>F</span><span>0–59%</span></div>
      </div>
    </div>
    <div class="ss-canvas-note">
      <div class="ss-canvas-note-title">Canvas Submission Instructions</div>
      <div class="ss-canvas-note-text">
        1. Click <strong>Print / Save PDF</strong> above (or press Ctrl+P) and save this score sheet as PDF<br>
        2. Log in to Canvas and open the <strong>${p.title} — ${p.company}</strong> assignment<br>
        3. Upload <strong>two files</strong>: (1) your completed .${p.fileType} file and (2) this score sheet PDF<br>
        4. Also upload your screen recording if required<br>
        5. Your instructor will review and enter the final grade in Canvas
      </div>
    </div>
    <div class="ss-signature">
      <div><div class="ss-sig-line"></div>Student Signature / Date</div>
      <div><div class="ss-sig-line"></div>Instructor Signature / Date</div>
    </div>
    <div class="ss-footer">Auto-generated by IS101 Project Grader · ${p.title} · ${p.company} · ${date} · Dr. Mark Taormino · College of Southern Nevada</div>`;

  document.getElementById('scoresheet-content').innerHTML = html;
  document.getElementById('ss-modal').classList.add('open');
  currentScoreData = { html, project: p, studentName, studentId, date };
}

function closeScoresheet() { document.getElementById('ss-modal').classList.remove('open'); }
window.closeScoresheet = closeScoresheet;

  .ss-meta-value{font-size:13px;font-weight:600;color:#1f2937}

  const blob = new Blob([full], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);

window.downloadScoresheet = downloadScoresheet;
window.openScoresheet = openScoresheet;
