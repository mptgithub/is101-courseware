<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IS101 Project Grader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --word:#2b579a;--word-lt:#e8f0fb;--word-dk:#1e3a8a;
  --excel:#217346;--excel-lt:#e0f0e8;--excel-dk:#155c32;
  --gray:#f3f4f6;--border:#d1d5db;--text:#1f2937;--muted:#6b7280;
  --ok:#15803d;--ok-lt:#f0fdf4;--ok-bd:#86efac;
  --err:#dc2626;--err-lt:#fef2f2;--err-bd:#fca5a5;
  --warn:#d97706;--warn-lt:#fffbeb;--warn-bd:#fde68a;
  --partial:#7c3aed;--partial-lt:#f5f3ff;--partial-bd:#c4b5fd;
}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#f9fafb;color:var(--text);min-height:100vh}

/* ── NAV ── */
#nav{background:#1e293b;padding:0 24px;display:flex;align-items:center;gap:12px;height:52px;flex-shrink:0}
#nav .logo{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.3px}
#nav .logo span{color:#60a5fa}
#nav .breadcrumb{font-size:12px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:16px}
#nav .breadcrumb button{background:transparent;border:none;color:#60a5fa;cursor:pointer;font-size:12px;font-family:inherit}
#nav .breadcrumb button:hover{text-decoration:underline}
#nav .spacer{flex:1}
#nav .student-info{display:flex;align-items:center;gap:8px}
#nav input{background:#334155;border:1px solid #475569;color:#e2e8f0;padding:5px 10px;border-radius:4px;font-size:12px;font-family:inherit;width:160px}
#nav input::placeholder{color:#94a3b8}

/* ── MAIN WRAPPER ── */
#main{max-width:1100px;margin:0 auto;padding:28px 24px}

/* ── HOME SCREEN ── */
.home-title{font-size:26px;font-weight:700;color:#1e293b;margin-bottom:6px}
.home-sub{font-size:14px;color:var(--muted);margin-bottom:28px}
.exam-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px}
.exam-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px 22px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.exam-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.exam-card.word::before{background:var(--word)}
.exam-card.excel::before{background:var(--excel)}
.exam-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.1)}
.exam-card .ec-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:3px 8px;border-radius:3px;margin-bottom:10px;display:inline-block}
.exam-card.word .ec-badge{background:var(--word-lt);color:var(--word)}
.exam-card.excel .ec-badge{background:var(--excel-lt);color:var(--excel)}
.exam-card .ec-title{font-size:18px;font-weight:700;color:#1e293b;margin-bottom:4px}
.exam-card .ec-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.exam-card .ec-domains{display:flex;flex-wrap:wrap;gap:6px}
.ec-domain-tag{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--gray);color:var(--muted)}

/* ── DOMAIN / PROJECT SELECTOR ── */
.section-title{font-size:20px;font-weight:700;color:#1e293b;margin-bottom:4px}
.section-sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.domain-list{display:flex;flex-direction:column;gap:14px}
.domain-card{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.domain-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.domain-name{font-size:14px;font-weight:600;color:#1e293b}
.domain-code{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.projects-row{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.project-btn{background:#fff;padding:14px 18px;cursor:pointer;border:none;text-align:left;font-family:inherit;transition:background .1s}
.project-btn:hover{background:#f8faff}
.project-btn .pb-num{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:3px}
.project-btn .pb-title{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:2px}
.project-btn .pb-pts{font-size:11px;color:var(--muted)}
.project-btn .pb-score{font-size:11px;font-weight:600;margin-top:4px}

/* ── PROJECT SCREEN ── */
.project-layout{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:flex-start}
.project-left{}
.project-right{}
.p-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.p-card-hd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.p-card-hd .phd-icon{font-size:18px}
.p-card-hd .phd-title{font-size:14px;font-weight:600;color:#1e293b}
.p-card-body{padding:16px 18px}
.scenario-box{background:#f8faff;border:1px solid #dbeafe;border-radius:6px;padding:12px 14px;font-size:13px;color:#1e40af;line-height:1.55;margin-bottom:16px}
.scenario-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#2563eb;margin-bottom:4px}

/* Rubric list */
.rubric-list{display:flex;flex-direction:column;gap:8px}
.rubric-item{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:6px;border:1px solid var(--border);background:#fff;transition:background .15s}
.rubric-item.checked-ok{background:var(--ok-lt);border-color:var(--ok-bd)}
.rubric-item.checked-partial{background:var(--partial-lt);border-color:var(--partial-bd)}
.rubric-item.checked-err{background:var(--err-lt);border-color:var(--err-bd)}
.rubric-item.checked-warn{background:var(--warn-lt);border-color:var(--warn-bd)}
.ri-num{width:22px;height:22px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;color:var(--muted)}
.ri-num.ok{background:var(--ok-bd);color:var(--ok)}
.ri-num.err{background:var(--err-bd);color:var(--err)}
.ri-num.partial{background:var(--partial-bd);color:var(--partial)}
.ri-num.warn{background:var(--warn-bd);color:var(--warn)}
.ri-body{flex:1;min-width:0}
.ri-desc{font-size:12px;color:#374151;line-height:1.5;margin-bottom:2px}
.ri-pts{font-size:10px;color:var(--muted)}
.ri-feedback{font-size:11px;margin-top:4px;font-style:italic}
.ri-feedback.ok{color:var(--ok)}.ri-feedback.err{color:var(--err)}.ri-feedback.partial{color:var(--partial)}.ri-feedback.warn{color:var(--warn)}
.ri-score-badge{flex-shrink:0;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap}
.ri-score-badge.ok{background:var(--ok-bd);color:var(--ok)}
.ri-score-badge.err{background:var(--err-bd);color:var(--err)}
.ri-score-badge.partial{background:var(--partial-bd);color:var(--partial)}
.ri-score-badge.warn{background:var(--warn-bd);color:var(--warn)}

/* Reference image card */
.ref-img-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#f8faff}
.ref-img-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--border);background:#fff}
.ref-img-body{padding:12px}

/* Upload zone */
.upload-zone{border:2px dashed var(--border);border-radius:8px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .15s;background:#fafafa}
.upload-zone:hover,.upload-zone.drag-over{border-color:#2563eb;background:#eff6ff}
.upload-zone .uz-icon{font-size:32px;margin-bottom:8px}
.upload-zone .uz-title{font-size:13px;font-weight:600;color:#374151;margin-bottom:4px}
.upload-zone .uz-sub{font-size:11px;color:var(--muted)}
.upload-zone.has-file{border-color:var(--ok);background:var(--ok-lt)}
.file-info{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f9fafb;border:1px solid var(--border);border-radius:6px;margin-top:10px}
.file-info .fi-icon{font-size:20px}
.file-info .fi-name{font-size:12px;font-weight:600;color:#374151;flex:1}
.file-info .fi-size{font-size:11px;color:var(--muted)}
.file-info .fi-remove{background:transparent;border:none;cursor:pointer;color:var(--err);font-size:14px;padding:2px 4px}

/* Buttons */
.btn{padding:9px 20px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .12s}
.btn-primary-word{background:var(--word);color:#fff}.btn-primary-word:hover{background:var(--word-dk)}
.btn-primary-excel{background:var(--excel);color:#fff}.btn-primary-excel:hover{background:var(--excel-dk)}
.btn-outline{background:#fff;border:1px solid var(--border);color:#374151}.btn-outline:hover{background:#f9fafb}
.btn-lg{padding:12px 24px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* Score summary */
.score-summary{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-top:16px}
.ss-heading{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.score-bar-wrap{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-bottom:8px}
.score-bar-fill{height:100%;border-radius:4px;transition:width .6s}
.score-numbers{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.score-big{font-size:28px;font-weight:800;color:var(--ok);text-align:center;line-height:1;margin:8px 0}
.score-pct{font-size:14px;color:var(--muted);text-align:center;margin-bottom:12px}
.grade-box{text-align:center;padding:8px;border-radius:6px;margin-bottom:12px}
.grade-letter{font-size:32px;font-weight:800}

/* ── SCORE SHEET (printable) ── */
.scoresheet-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;overflow-y:auto;padding:40px 24px}
.scoresheet-modal.open{display:flex;justify-content:center;align-items:flex-start}
.scoresheet-inner{background:#fff;width:760px;border-radius:4px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ss-modal-toolbar{background:#1e293b;padding:12px 18px;display:flex;align-items:center;gap:10px}
.ss-modal-toolbar span{color:#fff;font-size:13px;font-weight:500;flex:1}

/* Print styles */
@media print{
  body *{visibility:hidden}
  .scoresheet-content,.scoresheet-content *{visibility:visible}
  .scoresheet-content{position:fixed;top:0;left:0;right:0;margin:0;padding:0;background:#fff}
  .ss-modal-toolbar{display:none}
}
.scoresheet-content{padding:32px 40px;font-family:"Calibri",serif}
.ss-header{border-bottom:3px solid #1e293b;padding-bottom:14px;margin-bottom:18px}
.ss-institution{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#6b7280;margin-bottom:4px}
.ss-doc-title{font-size:22px;font-weight:700;color:#1e293b;margin-bottom:2px}
.ss-subtitle{font-size:13px;color:#4b5563}
.ss-meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border:1px solid #d1d5db;margin-bottom:18px}
.ss-meta-cell{padding:8px 12px;border-right:1px solid #d1d5db}
.ss-meta-cell:last-child{border-right:none}
.ss-meta-label{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:#9ca3af;margin-bottom:2px}
.ss-meta-value{font-size:13px;font-weight:600;color:#1f2937}
.ss-project-info{background:#f8faff;border:1px solid #dbeafe;padding:10px 14px;border-radius:4px;margin-bottom:18px}
.ss-project-name{font-size:15px;font-weight:700;color:#1e3a8a}
.ss-project-meta{font-size:11px;color:#4b5563;margin-top:2px}
.ss-scenario{font-size:12px;color:#374151;margin-top:6px;line-height:1.55;font-style:italic}
.ss-rubric-table{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:12px}
.ss-rubric-table th{background:#1e293b;color:#fff;padding:7px 10px;text-align:left;font-weight:600;font-size:11px}
.ss-rubric-table td{padding:8px 10px;border-bottom:1px solid #e5e7eb;vertical-align:top}
.ss-rubric-table tr:nth-child(even) td{background:#f9fafb}
.ss-rubric-table .status-ok{color:#15803d;font-weight:700}
.ss-rubric-table .status-partial{color:#7c3aed;font-weight:700}
.ss-rubric-table .status-err{color:#dc2626;font-weight:700}
.ss-rubric-table .status-manual{color:#d97706;font-weight:700}
.ss-totals{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px}
.ss-total-box{border:2px solid #1e293b;padding:14px;text-align:center}
.ss-total-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#6b7280;margin-bottom:4px}
.ss-total-score{font-size:32px;font-weight:800;color:#1e293b}
.ss-total-grade{font-size:20px;font-weight:700;margin-top:4px}
.ss-grade-scale{border:1px solid #d1d5db;padding:10px 14px}
.ss-grade-scale-title{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#9ca3af;margin-bottom:6px}
.ss-grade-row{display:flex;justify-content:space-between;font-size:11px;color:#374151;padding:2px 0;border-bottom:1px solid #f3f4f6}
.ss-canvas-note{background:#fffbeb;border:1px solid #fde68a;padding:12px 14px;border-radius:4px;margin-bottom:16px}
.ss-canvas-note-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#92400e;margin-bottom:4px}
.ss-canvas-note-text{font-size:11px;color:#78350f;line-height:1.55}
.ss-signature{border-top:1px solid #d1d5db;padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:11px;color:#6b7280}
.ss-sig-line{border-bottom:1px solid #1e293b;height:24px;margin-bottom:4px}
.ss-footer{text-align:center;font-size:9px;color:#9ca3af;border-top:1px solid #e5e7eb;padding-top:10px;margin-top:16px}
.auto-badge{font-size:9px;padding:1px 5px;border-radius:3px;background:#dbeafe;color:#1d4ed8;font-weight:700;white-space:nowrap;margin-left:4px}
.manual-badge{font-size:9px;padding:1px 5px;border-radius:3px;background:#fef3c7;color:#92400e;font-weight:700;white-space:nowrap;margin-left:4px}
</style>
</head>
<body>

<!-- NAV -->
<div id="nav">
  <div class="logo">IS101 <span>Project Grader</span></div>
  <div class="breadcrumb" id="breadcrumb"></div>
  <div class="spacer"></div>
  <div class="student-info">
    <input id="student-name" type="text" placeholder="Student name…">
    <input id="student-id" type="text" placeholder="Student ID…" style="width:100px">
  </div>
</div>

<!-- SCORE SHEET MODAL -->
<div class="scoresheet-modal" id="ss-modal">
  <div class="scoresheet-inner">
    <div class="ss-modal-toolbar">
      <span>Score Sheet — Canvas Submission Copy</span>
      <button class="btn btn-outline" onclick="window.print()">🖨 Print / Save PDF</button>
      <button class="btn btn-outline" onclick="downloadScoresheet()">⬇ Download HTML</button>
      <button class="btn btn-outline" onclick="closeScoresheet()" style="margin-left:8px">✕ Close</button>
    </div>
    <div class="scoresheet-content" id="scoresheet-content"></div>
  </div>
</div>

<div id="main"></div>

<input type="file" id="file-input" accept=".docx,.xlsx" style="display:none">

<script>
// ══════════════════════════════════════════════════════════
// PROJECTS DATA
// ══════════════════════════════════════════════════════════
const PROJECTS = [

// ─── IS101 EXCEL ──────────────────────────────────────────────────────────

// D1: Worksheets & Workbooks
{
  id:'xl-d1-p1', exam:'excel', domain:'D1', domainName:'Worksheets & Workbooks',
  projectNum:1, fileType:'xlsx',
  title:'Regional Sales Workbook',
  scenario:'You are a data analyst at Apex Sales Corp. Set up a multi-sheet workbook to track quarterly regional sales data and configure it for professional distribution.',
  totalPts:30,
  instructions:[
    'Open Excel and rename the default sheet to exactly: Q1 Sales',
    'Insert a second worksheet and rename it to exactly: Q2 Sales',
    'Insert a third worksheet and rename it to exactly: Summary',
    'On the Q1 Sales sheet, type the column headers: Region (A1), Sales (B1), Month (C1)',
    'On the Q1 Sales sheet, freeze the top row so headers stay visible while scrolling',
  ],
  rubric:[
    {desc:'Sheet named "Q1 Sales" exists',pts:6,auto:true,
     check:async(zip)=>xmlContains(await getFile(zip,'xl/workbook.xml'),`name="Q1 Sales"`)},
    {desc:'Sheet named "Q2 Sales" exists',pts:6,auto:true,
     check:async(zip)=>xmlContains(await getFile(zip,'xl/workbook.xml'),`name="Q2 Sales"`)},
    {desc:'Sheet named "Summary" exists',pts:6,auto:true,
     check:async(zip)=>xmlContains(await getFile(zip,'xl/workbook.xml'),`name="Summary"`)},
    {desc:'Q1 Sales sheet has column headers (Region, Sales, Month)',pts:6,auto:true,
     check:async(zip)=>{const ws=await getSheetByName(zip,'Q1 Sales');return ws&&ws.includes('Region')&&ws.includes('Sales')&&ws.includes('Month');}},
    {desc:'Freeze panes applied to top row on Q1 Sales sheet',pts:6,auto:true,
     check:async(zip)=>{const ws=await getSheetByName(zip,'Q1 Sales');return ws&&(xmlContains(ws,'<pane ')||xmlContains(ws,'freezePanes')||xmlContains(ws,'topLeftCell'));}},
  ],
  reference: buildXlRef([
    {type:'tabs',sheets:['Q1 Sales','Q2 Sales','Summary']},
    {type:'grid',rows:[['Region','Sales','Month'],['North','$12,400','January'],['South','$9,800','January'],['East','$14,200','January']],freeze:true}
  ])
},
{
  id:'xl-d1-p2', exam:'excel', domain:'D1', domainName:'Worksheets & Workbooks',
  projectNum:2, fileType:'xlsx',
  title:'Print & Page Configuration',
  scenario:'Prepare the Q1 Sales report for printing and executive distribution. Configure page layout settings for professional output.',
  totalPts:30,
  instructions:[
    'Set the page orientation to Landscape',
    'Set the page margins to Narrow (0.5" on all sides)',
    'Set the print area to A1:C20 on Sheet1',
    'Add a page header containing the text: Apex Sales Corp',
    'Set the zoom to 85% for screen display',
  ],
  rubric:[
    {desc:'Page orientation set to Landscape',pts:8,auto:true,
     check:async(zip)=>{const ws=await getSheet(zip,1);return ws&&(xmlContains(ws,'orientation="landscape"')||xmlContains(ws,'landscape'));}},
    {desc:'Narrow margins applied (left/right ≤ 720 twips / 0.5")',pts:7,auto:true,
     check:async(zip)=>{const ws=await getSheet(zip,1);if(!ws)return false;const m=ws.match(/left="(\d+)"/);return m&&parseInt(m[1])<=720;}},
    {desc:'Print area defined (A1:C20)',pts:5,auto:true,
     check:async(zip)=>{const ws=await getSheet(zip,1);return ws&&xmlContains(ws,'printArea');}},
    {desc:'Header text present',pts:5,auto:false,note:'Check that the header row contains your company name.',
     check:async(zip)=>{const h=await getFile(zip,'xl/worksheets/_rels/sheet1.xml.rels');const hf=await getFile(zip,'xl/worksheets/../oddHeader');return false;}},
    {desc:'Professional print layout (manual review)',pts:5,auto:false,note:'Instructor will verify print preview shows correct layout.',
     check:async()=>null},
  ],
  reference: buildXlRef([
    {type:'page-setup',orientation:'Landscape',margins:'Narrow',header:'Apex Sales Corp',zoom:'85%'}
  ])
},

// D2: Cells & Ranges
{
  id:'xl-d2-p1', exam:'excel', domain:'D2', domainName:'Cells & Ranges',
  projectNum:1, fileType:'xlsx',
  title:'Employee Data Formatting',
  scenario:'Format an employee database spreadsheet to meet company data standards. Apply professional formatting and create a named range for use in formulas.',
  totalPts:30,
  instructions:[
    'In Row 1, type the headers: Name (A1), Department (B1), Salary (C1), Start Date (D1)',
    'Enter at least 5 employee records in rows 2–6',
    'Apply Bold formatting to the entire header row (A1:D1)',
    'Format the Salary column (C2:C6) as Currency with 2 decimal places',
    'Name the range A1:D6 as: EmployeeData',
  ],
  rubric:[
    {desc:'Header row contains Name, Department, Salary, Start Date',pts:4,auto:true,
     check:async(zip)=>{const ws=await getSheet(zip,1);return ws&&ws.includes('Name')&&ws.includes('Department')&&ws.includes('Salary');}},
    {desc:'At least 5 data rows entered (rows 2–6)',pts:6,auto:true,
     check:async(zip)=>{const ws=await getSheet(zip,1);const rows=ws?.match(/<row r="[2-9]"/g)||[];return rows.length>=4;}},
    {desc:'Bold formatting applied to row 1',pts:6,auto:true,
     check:async(zip)=>{const styles=await getFile(zip,'xl/styles.xml');const ws=await getSheet(zip,1);return styles&&xmlContains(styles,'<b/>')&&xmlContains(styles,'<b>');}},
    {desc:'Currency format applied to Salary column (C)',pts:8,auto:true,
     check:async(zip)=>{const styles=await getFile(zip,'xl/styles.xml');return styles&&(xmlContains(styles,'"$"'))||xmlContains(styles,'numFmtId="164"')||xmlContains(styles,'#,##0');}},
    {desc:'Named range "EmployeeData" defined',pts:6,auto:true,
     check:async(zip)=>{const wb=await getFile(zip,'xl/workbook.xml');return wb&&xmlContains(wb,'EmployeeData');}},
  ],
  reference: buildXlRef([
    {type:'grid',rows:[
      ['Name','Department','Salary','Start Date'],
      ['Alice Johnson','HR','$58,000.00','2020-03-15'],
      ['Bob Martinez','IT','$72,000.00','2019-08-01'],

// ══════════════════════════════════════════════════════════
// XML HELPER FUNCTIONS
// ══════════════════════════════════════════════════════════
function xmlContains(xml,str){if(!xml||!str)return false;return xml.includes(str);}
async function getFile(zip,path){try{return await zip.file(path)?.async('text');}catch{return null;}}
async function getSheet(zip,num=1){return getFile(zip,`xl/worksheets/sheet${num}.xml`);}
async function getSheetByName(zip,name){
  const wb=await getFile(zip,'xl/workbook.xml');
  if(!wb)return null;
  const m=wb.match(new RegExp(`<sheet[^>]+name="${name}"[^>]+r:id="(rId\\d+)"`));
  if(!m)return null;
  const rels=await getFile(zip,'xl/workbook.xml.rels')||await getFile(zip,'xl/_rels/workbook.xml.rels');
  if(!rels)return null;
  const rm=rels.match(new RegExp(`Id="${m[1]}"[^>]+Target="([^"]+)"`));
  if(!rm)return null;
  return getFile(zip,`xl/${rm[1]}`)||getFile(zip,rm[1]);
}

// REFERENCE IMAGE BUILDERS (SVG mockups)
// ══════════════════════════════════════════════════════════
function buildXlRef(specs){
  const s=specs[0];
  if(!s)return '<div style="padding:20px;color:#999;font-size:11px">Reference preview not available</div>';
  if(s.type==='grid'||s.type==='formula-grid'){
    const rows=s.rows;const bold0=s.bold_row1;
    // Cells that look like placeholders (contain "formula" or start with "[")
    const isPlaceholder=v=>String(v).startsWith('[')||String(v).toLowerCase().includes('formula');
    let h=`<table style="border-collapse:collapse;font-size:11px;width:100%;font-family:Calibri,sans-serif">`;
    rows.forEach((row,ri)=>{
      const isHeader=ri===0;
      h+=`<tr style="background:${isHeader?'#217346':ri%2===0?'#fff':'#f0f0f0'}">`;
      row.forEach((cell,ci)=>{
        const isNum=typeof cell==='number'||String(cell).startsWith('$');
        const isPlhd=!isHeader&&isPlaceholder(cell);
        // placeholder cells get a distinctive amber "formula needed" style
        const bg=isPlhd?'#fef9c3':'';
        const border=isPlhd?'border:2px dashed #f59e0b;':'border:1px solid #d0d0d0;';
        const color=isHeader?'#fff':isPlhd?'#92400e':'#1f1f1f';
        const fw=isHeader||(bold0&&ri===0)?'700':isPlhd?'600':'400';
        const align=isNum&&!isPlhd?'right':'left';
        const display=isPlhd?`<span style="font-size:9px">f(x) ${String(cell).replace(/[\[\]]/g,'')}</span>`:cell;
        h+=`<td style="${border}padding:3px 6px;font-weight:${fw};color:${color};text-align:${align};background:${bg}">${display}</td>`;
      });
      h+=`</tr>`;
    });
    if(s.freeze)h+=`<tr><td colspan="${rows[0].length}" style="background:#d0f0e8;color:#217346;font-size:10px;font-weight:600;padding:3px 6px;border:1px solid #a0d0b8">⎂ Row 1 frozen — stays visible while scrolling</td></tr>`;
    h+=`</table>`;
    // Legend for formula placeholder cells
    if(s.type==='formula-grid')h+=`<div style="margin-top:5px;display:flex;align-items:center;gap:6px;font-size:10px;color:#78350f"><span style="display:inline-block;width:12px;height:12px;background:#fef9c3;border:2px dashed #f59e0b"></span>Cells you must complete with the correct formula</div>`;
    return h;
  }
  if(s.type==='tabs'){
    return `<div style="font-size:11px;color:#555"><div style="display:flex;gap:2px;align-items:flex-end;margin-bottom:8px">${s.sheets.map((n,i)=>`<div style="padding:4px 12px;border:1px solid #c8c8c8;border-bottom:none;background:${i===0?'#fff':'#f2f2f2'};border-radius:2px 2px 0 0;font-size:10px;font-weight:${i===0?700:400};color:${i===0?'#217346':'#555'}">${n}</div>`).join('')}</div><div style="border-top:2px solid #217346"></div><div style="padding:8px;background:#fff;border:1px solid #d0d0d0;font-size:10px;color:#888">↑ Three worksheets created and renamed as required</div></div>`;
  }
  if(s.type==='table'){
    let h=`<table style="border-collapse:collapse;font-size:11px;width:100%;font-family:Calibri,sans-serif">`;
    h+=`<thead><tr>${s.headers.map(c=>`<th style="background:#217346;color:#fff;padding:4px 7px;border:1px solid #185c32;text-align:left">${c}</th>`).join('')}</tr></thead>`;
    h+=`<tbody>${s.rows.map((r,i)=>`<tr style="background:${i%2===0?'#fff':'#e8f5ee'}">${r.map(c=>`<td style="border:1px solid #d0d0d0;padding:3px 7px">${c}</td>`).join('')}</tr>`).join('')}</tbody>`;
    if(s.total)h+=`<tfoot><tr>${s.headers.map((c,i)=>`<td style="border:1px solid #c8c8c8;border-top:2px solid #217346;padding:3px 7px;font-weight:700;background:#fef9c3;${i===s.headers.length-1?'border:2px dashed #f59e0b;color:#92400e':''}">${i===s.headers.length-1?'f(x) SUM here':i===0?'TOTAL':''}</td>`).join('')}</tr></tfoot>`;
    h+=`</table>`;
    if(s.sorted||s.filtered||s.formula){h+=`<div style="margin-top:6px;font-size:10px;color:#555;background:#f0f8f4;padding:5px 8px;border-radius:3px">`; if(s.sorted)h+=`↕ Sorted by ${s.sorted} · `; if(s.filtered)h+=`⊽ Filtered: ${s.filtered} · `; if(s.formula)h+=`Formula: ${s.formula}`; h+=`</div>`;}
    return h;
  }
  if(s.type==='chart'){
    const bars=s.data.map(([m,v])=>({m,v,pct:Math.round(v/Math.max(...s.data.map(d=>d[1]))*80)}));
    return `<div style="padding:8px"><div style="font-size:12px;font-weight:700;text-align:center;color:#1f1f1f;margin-bottom:8px">${s.title}</div><div style="display:flex;align-items:flex-end;gap:6px;height:90px;border-left:2px solid #888;border-bottom:2px solid #888;padding:4px 0 0 4px">${bars.map(b=>`<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div style="background:#217346;width:26px;height:${b.pct}px"></div><div style="font-size:9px;color:#555">${b.m}</div>`).join('')}</div><div style="font-size:10px;color:#888;margin-top:4px;text-align:center">${s.xLabel||''}</div></div>`;
  }
  if(s.type==='pie-chart'){
    return `<div style="text-align:center;padding:8px"><div style="font-size:12px;font-weight:700;margin-bottom:8px">${s.title}</div><svg width="140" height="140" viewBox="0 0 140 140">${buildPie(s.slices)}</svg><div style="font-size:10px;margin-top:6px">${s.slices.map(([n,v],i)=>`<span style="display:inline-flex;align-items:center;gap:3px;margin:2px 4px"><span style="display:inline-block;width:10px;height:10px;background:${['#217346','#60a5fa','#f59e0b','#ef4444'][i]}"></span>${n}: ${v}%</span>`).join('')}</div>${s.ownSheet?`<div style="margin-top:6px;font-size:10px;background:#f0f8f4;padding:4px 8px;border-radius:3px;color:#217346">📄 Moved to sheet: "${s.ownSheet}"</div>`:''}</div>`;
  }
  if(s.type==='page-setup'){

    return h;

}

function buildPie(slices){
  const colors=['#217346','#60a5fa','#f59e0b','#ef4444'];
  let paths='';let startAngle=0;const cx=70,cy=70,r=60;
  slices.forEach(([n,v],i)=>{
    const angle=v/100*2*Math.PI;const endAngle=startAngle+angle;
    const x1=cx+r*Math.sin(startAngle),y1=cy-r*Math.cos(startAngle);
    const x2=cx+r*Math.sin(endAngle),y2=cy-r*Math.cos(endAngle);
    const large=angle>Math.PI?1:0;
    paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${colors[i]}" stroke="#fff" stroke-width="2"/>`;
    const mid=startAngle+angle/2;
    const lx=cx+(r*.65)*Math.sin(mid),ly=cy-(r*.65)*Math.cos(mid);
    paths+=`<text x="${lx}" y="${ly}" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">${v}%</text>`;
    startAngle=endAngle;
  });
  return paths;
}

function buildDocRef(specs){
  let html='';
  specs.forEach(s=>{
    if(s.type==='paragraph'){
      const fw=s.bold?'700':'400';const fs=s.style==='Title'?20:s.style==='Heading1'?16:s.style==='Heading2'?14:12;
      const color=s.style==='Title'?'#1a1a1a':s.style?.startsWith('Heading')?'#2e74b5':'#374151';
      const bd=s.style==='Heading1'?'border-bottom:1px solid #2e74b5;padding-bottom:3px;margin-bottom:5px':'';
      const ls=s.spacing==='double'?'line-height:2.2':s.spacing==='1.5'?'line-height:1.75':'line-height:1.65';
      let txt=s.text||'';
      if(s.comment)txt+=` <span style="background:#fef9c3;border:1px solid #fde68a;font-size:9px;padding:1px 5px;border-radius:2px;color:#92400e" title="Comment attached">💬 Comment</span>`;
      if(s.footnote)txt+=`<sup style="color:#2b579a;font-weight:700;font-size:9px">${s.footnote}</sup>`;
      html+=`<div style="font-size:${fs}px;font-weight:${fw};color:${color};${bd};${ls};margin-bottom:6px;${s.align?`text-align:${s.align}`:''}">`;
      html+=s.text?.includes('<b><i>')?s.text:txt;
      html+=`</div>`;
    } else if(s.type==='toc'){
      html+=`<div style="background:#f8faff;border:1px solid #dbeafe;padding:8px 12px;margin-bottom:6px"><div style="font-size:12px;font-weight:700;color:#1e40af;margin-bottom:4px">Table of Contents</div>${s.entries.map(e=>`<div style="font-size:11px;color:#374151;display:flex;justify-content:space-between;border-bottom:1px dotted #93c5fd;padding:1px 0">${e}</div>`).join('')}</div>`;
    } else if(s.type==='table'){
      let t=``;
      if(s.mergedTitle)t+=`<tr><td colspan="${s.headers.length}" style="background:#2b579a;color:#fff;font-weight:700;padding:4px 8px;border:1px solid #1e3a8a;text-align:center">${s.mergedTitle}</td></tr>`;
      t+=`<tr>${s.headers.map(c=>`<th style="background:${c.startsWith('[')?' #9ca3af':'#2b579a'};color:#fff;padding:3px 7px;border:1px solid #1e3a8a;font-size:11px">${c}</th>`).join('')}</tr>`;
      t+=s.rows.map((r,i)=>`<tr style="background:${i%2===0?'#fff':'#f0f4ff'}">${r.map(c=>`<td style="border:1px solid #d1d5db;padding:3px 7px;font-size:11px;color:${c==='…'?'#9ca3af':'#1f1f1f'}">${c}</td>`).join('')}</tr>`).join('');
      html+=`<table style="border-collapse:collapse;width:100%;margin-bottom:6px">${t}</table>`;
      if(s.note)html+=`<div style="font-size:10px;color:#6b7280;font-style:italic;margin-bottom:4px">↑ ${s.note}</div>`;
    } else if(s.type==='header'){
      html+=`<div style="border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:8px;text-align:center;font-size:11px;color:#555">⊤ ${s.text}</div>`;
    } else if(s.type==='footer'){
      html+=`<div style="border-top:1px solid #ddd;padding-top:4px;margin-top:8px;text-align:center;font-size:11px;color:#555">⊥ ${s.text}</div>`;
    } else if(s.type==='pagebreak'){
      html+=`<div style="border-top:2px dashed #ccc;text-align:center;font-size:9px;color:#aaa;padding:3px 0;margin:6px 0">— Page Break —</div>`;
    } else if(s.type==='divider'){
      html+=`<hr style="border:none;border-top:1px solid #d1d5db;margin:6px 0">`;
    } else if(s.type==='field-row'){
      html+=`<div style="font-size:11px;margin-bottom:3px;color:#374151"><strong style="min-width:60px;display:inline-block">${s.label}</strong> ${s.value}</div>`;
    } else if(s.type==='numberedlist'){
      html+=`<ol style="font-size:11px;color:#374151;padding-left:18px;margin-bottom:6px">${s.items.map(i=>`<li style="margin-bottom:2px">${i}</li>`).join('')}</ol>`;
    } else if(s.type==='bulletlist'){
      html+=`<ul style="font-size:11px;color:#374151;padding-left:18px;margin-bottom:6px">${s.items.map(i=>`<li style="margin-bottom:2px">${i}</li>`).join('')}</ul>`;
    } else if(s.type==='endnotes'){
      html+=`<div style="border-top:1px solid #aaa;margin-top:10px;padding-top:4px"><div style="font-size:10px;font-weight:700;margin-bottom:4px">Endnotes</div>${s.entries.map((e,i)=>`<div style="font-size:10px;color:#555"><sup>${['i','ii','iii','iv'][i]}</sup> ${e}</div>`).join('')}</div>`;
    } else if(s.type==='status-banner'){
      html+=`<div style="background:${s.color==='green'?'#dcfce7':'#fef3c7'};border:1px solid ${s.color==='green'?'#86efac':'#fde68a'};padding:6px 10px;border-radius:3px;font-size:11px;font-weight:600;color:${s.color==='green'?'#15803d':'#92400e'};margin-bottom:6px">${s.text}</div>`;
    } else if(s.type==='restriction-banner'){
      html+=`<div style="background:#fef2f2;border:1px solid #fca5a5;padding:6px 10px;border-radius:3px;font-size:11px;font-weight:600;color:#dc2626;margin-bottom:6px">${s.text}</div>`;
    } else if(s.type==='newsletter'){
      html+=`<div style="display:grid;grid-template-columns:1fr 80px;gap:8px;font-size:11px"><div style="color:#374151;line-height:1.6">Newsletter article text flows here, wrapping around the image on the right side of the column. The Square text wrapping mode allows text on all four sides.<br><br>Second paragraph continues here with more article content about the quarterly highlights.</div><div style="width:80px;height:60px;background:#dbeafe;border:1px solid #93c5fd;display:flex;align-items:center;justify-content:center;font-size:9px;color:#1d4ed8;text-align:center">Image<br>⇄ Square<br>Wrap</div></div><div style="background:#f8faff;border-left:3px solid #2b579a;padding:6px 10px;margin-top:6px;font-size:11px;font-style:italic;color:#1e3a8a">Pull Quote: "Key insight from the article goes here in a text box"</div>`;
    } else if(s.type==='smartart'){
      html+=`<div style="background:#f0f4ff;border:1px solid #bfdbfe;padding:10px;text-align:center"><div style="font-size:10px;font-weight:700;color:#2b579a;margin-bottom:6px">${s.title}</div><div style="display:inline-block;background:#2b579a;color:#fff;padding:4px 16px;font-size:11px;font-weight:700;border-radius:2px;margin-bottom:8px">${s.nodes[0]}</div><div style="display:flex;gap:8px;justify-content:center">${s.nodes[1].map(n=>`<div style="background:#60a5fa;color:#fff;padding:3px 10px;font-size:10px;font-weight:600;border-radius:2px">${n}</div>`).join('')}</div></div>`;
    } else if(s.type==='shape'){
      html+=`<div style="border:2px solid ${s.color};background:${s.color};color:#fff;padding:8px 14px;border-radius:2px;font-size:11px;font-weight:600;text-align:center;margin-top:6px">${s.text}</div>`;
    }
  });
  return `<div style="background:#fff;padding:14px 18px;border:1px solid #d1d5db;font-family:Calibri,serif">${html}</div>`;
}

function updateBreadcrumb(){

      </div>

          <div class="upload-zone${hasFile?' has-file':''}" id="upload-zone" onclick="document.getElementById('file-input').click()">

            <div class="uz-title">${hasFile?S.uploadedFile.name:'Click to choose your file'}</div>
            <div class="uz-sub">${hasFile?`${(S.uploadedFile.size/1024).toFixed(0)} KB — ready to grade`:`Drop your .${p.fileType} file here or click to browse`}</div>
          </div>
          ${hasFile?`<div class="btn-row">
            <button class="btn ${btnClass} btn-lg" id="grade-btn">🔍 Grade My File</button>
            <button class="btn btn-outline" onclick="S.uploadedFile=null;render()">✕ Remove</button>

            <strong>📌 File requirements:</strong><br>
            • Save as <code>.${p.fileType}</code> format (not .doc or .xls)<br>

}

// ══════════════════════════════════════════════════════════
// EVENT BINDING
// ══════════════════════════════════════════════════════════
function bindEvents(){
  const fi=document.getElementById('file-input');
  if(fi){
    fi.onchange=e=>{const f=e.target.files[0];if(f){S.uploadedFile=f;fi.value='';render();}};
  }
  const gb=document.getElementById('grade-btn');
  if(gb) gb.onclick=gradeFile;
  const uz=document.getElementById('upload-zone');
  if(uz){
    uz.ondragover=e=>{e.preventDefault();uz.classList.add('drag-over');};
    uz.ondragleave=()=>uz.classList.remove('drag-over');
    uz.ondrop=e=>{e.preventDefault();uz.classList.remove('drag-over');const f=e.dataTransfer.files[0];if(f){S.uploadedFile=f;render();}};
  }
}

// ══════════════════════════════════════════════════════════
// GRADING ENGINE
// ══════════════════════════════════════════════════════════
async function gradeFile(){
  if(!S.uploadedFile||!S.project)return;
  const prog=document.getElementById('grading-progress');
  const gb=document.getElementById('grade-btn');
  if(prog){prog.style.display='block';}
  if(gb){gb.disabled=true;gb.textContent='Grading…';}
  try{
    const buf=await S.uploadedFile.arrayBuffer();
    const zip=await JSZip.loadAsync(buf);
    const results=[];
    for(const item of S.project.rubric){
      let pts=0,feedback='',auto=item.auto!==false,note=item.note||'';
      if(item.auto===false){
        pts=0;feedback='This item requires instructor review.';
      } else {
        try{
          const passed=await item.check(zip);
          if(passed===true){pts=item.pts;feedback='✓ Requirement verified in file.';}
          else if(passed===null){pts=0;feedback='Could not verify — manual review needed.';}
          else{pts=0;feedback='✗ This requirement was not detected in your file. Check that you followed the instruction exactly.';}
        } catch(e){
          pts=0;feedback='Could not parse file. Make sure you saved as .'+S.project.fileType;
        }
      }
      results.push({pts,maxPts:item.pts,feedback,auto,note});
    }
    S.gradeResults=results;
    saveGrade(S.project.id,results,S.project.totalPts);
  } catch(err){
    alert('Error reading file: '+err.message+'\n\nMake sure the file is saved in .'+S.project.fileType+' format (not an older .doc or .xls format).');
  }
  render();
}

// ══════════════════════════════════════════════════════════
// LOCAL STORAGE
// ══════════════════════════════════════════════════════════
function saveGrade(projectId,results,total){
  const earned=results.filter(r=>r.auto!==false).reduce((s,r)=>s+r.pts,0);
  const grades=loadGrades();
  grades[projectId]={totalEarned:earned,total,date:new Date().toLocaleDateString(),results};
  localStorage.setItem('mos-grades',JSON.stringify(grades));
}
function loadGrades(){try{return JSON.parse(localStorage.getItem('mos-grades')||'{}');}catch{return {};}}

// ══════════════════════════════════════════════════════════
// SCORE SHEET
// ══════════════════════════════════════════════════════════
function openScoresheet(){
  if(!S.gradeResults||!S.project)return;
  const p=S.project;
  const results=S.gradeResults;
  const studentName=document.getElementById('student-name').value||'[Student Name]';
  const studentId=document.getElementById('student-id').value||'[Student ID]';
  const earned=results.filter(r=>r.auto!==false).reduce((s,r)=>s+r.pts,0);
  const autoMax=p.rubric.filter(r=>r.auto!==false).reduce((s,r)=>s+r.pts,0);
  const manualMax=p.rubric.filter(r=>r.auto===false).reduce((s,r)=>s+r.pts,0);
  const pct=Math.round(earned/autoMax*100)||0;
  const grade=pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';
  const gradeColor=pct>=80?'#217346':pct>=60?'#d97706':'#dc2626';
  const date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const isWord=p.exam==='Word';
  const accentColor=isWord?'#2b579a':'#217346';

  const rubricRows=p.rubric.map((item,i)=>{
    const r=results[i];
    if(r.auto===false){
      return `<tr><td>${i+1}. ${item.desc}</td><td class="status-manual">Manual</td><td style="text-align:center">— / ${item.pts}</td><td><span class="manual-badge">Instructor review</span>${item.note?`<br><span style="font-size:10px;color:#78350f">${item.note}</span>`:''}</td></tr>`;
    }
    const passed=r.pts>=item.pts;
    const partial=r.pts>0&&r.pts<item.pts;
    const sc=passed?'status-ok':partial?'status-partial':'status-err';
    const sl=passed?'✓ Pass':partial?'◑ Partial':'✗ Fail';
    return `<tr><td>${i+1}. ${item.desc} <span class="auto-badge">Auto</span></td><td class="${sc}">${sl}</td><td style="text-align:center">${r.pts} / ${item.pts}</td><td style="font-size:11px;color:#555">${r.feedback||''}</td></tr>`;
  }).join('');

  const html=`
  <div class="ss-header">
    <div class="ss-institution">Microsoft Office Skills Certification Program</div>
    <div class="ss-doc-title" style="color:${accentColor}">IS101 Project Score Sheet</div>
    <div class="ss-subtitle">${p.exam} — ${p.exam==='Word'?'Word':'Excel'} (Microsoft 365)</div>
  </div>
  <div class="ss-meta-grid">
    <div class="ss-meta-cell"><div class="ss-meta-label">Student Name</div><div class="ss-meta-value">${studentName}</div></div>
    <div class="ss-meta-cell"><div class="ss-meta-label">Student ID</div><div class="ss-meta-value">${studentId}</div></div>
    <div class="ss-meta-cell"><div class="ss-meta-label">Date Submitted</div><div class="ss-meta-value">${date}</div></div>
  </div>
  <div class="ss-project-info">
    <div class="ss-project-name">${p.domain}: ${p.domainName} — Project ${p.projectNum}: ${p.title}</div>
    <div class="ss-project-meta">${p.exam} · File type: .${p.fileType} · Total points: ${p.totalPts}</div>
    <div class="ss-scenario">${p.scenario}</div>
  </div>
  <table class="ss-rubric-table">
    <thead><tr><th style="width:45%">Rubric Item</th><th style="width:12%">Status</th><th style="width:12%;text-align:center">Score</th><th style="width:31%">Feedback</th></tr></thead>
    <tbody>${rubricRows}</tbody>
  </table>
  <div class="ss-totals">
    <div class="ss-total-box" style="border-color:${accentColor}">
      <div class="ss-total-label">Auto-Graded Score</div>
      <div class="ss-total-score" style="color:${gradeColor}">${earned} / ${autoMax}</div>
      ${manualMax>0?`<div style="font-size:11px;color:#6b7280;margin-top:4px">+${manualMax} pts pending instructor review</div>`:''}
      <div class="ss-total-grade" style="color:${gradeColor}">${pct}%</div>
    </div>
    <div>
      <div class="ss-grade-scale">
        <div class="ss-grade-scale-title">Grade Scale</div>
        ${[['A','90–100%'],['B','80–89%'],['C','70–79%'],['D','60–69%'],['F','< 60%']].map(([g,r])=>`<div class="ss-grade-row${pct>=(parseInt(r))||g==='F'&&pct<60?' style="font-weight:700;background:#f9fafb"':''}"><span>${g}</span><span>${r}</span></div>`).join('')}
      </div>
      <div style="margin-top:10px;padding:8px;border:1px solid #d1d5db;font-size:11px;color:#374151">
        <strong>Instructor Note:</strong><br>
        <div style="height:40px;border-bottom:1px solid #d1d5db;margin-top:4px"></div>
      </div>
    </div>
  </div>
  <div class="ss-canvas-note">
    <div class="ss-canvas-note-title">📤 Canvas Submission Instructions</div>
    <div class="ss-canvas-note-text">
      1. Click <strong>Print / Save PDF</strong> above (or press Ctrl+P) and save as PDF<br>
      2. Log in to Canvas and open the <strong>${p.exam} ${p.domainName} Project ${p.projectNum}</strong> assignment<br>
      3. Upload <strong>two files</strong>: (1) your .${p.fileType} project file, and (2) this score sheet PDF<br>
      4. Your instructor will review manual items and enter the final grade into the Canvas gradebook
    </div>
  </div>
  <div class="ss-signature">
    <div><div class="ss-sig-line"></div>Student Signature / Date</div>
    <div><div class="ss-sig-line"></div>Instructor Signature / Date</div>
  </div>
  <div class="ss-footer">Auto-generated by IS101 Project Grader · ${p.exam} ${p.title} · ${date} · For instructor and Canvas submission use only</div>`;

  document.getElementById('scoresheet-content').innerHTML=html;
  document.getElementById('ss-modal').classList.add('open');
  currentScoreData={html,project:p,studentName,studentId,date};
}
function closeScoresheet(){document.getElementById('ss-modal').classList.remove('open');}
window.closeScoresheet=closeScoresheet;
window.openScoresheet=openScoresheet;

4px}.ss-grade-scale{border:1px solid #d1d5db;padding:10px 14px}.ss-grade-scale-title{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#9ca3af;margin-bottom:6px}.ss-grade-row{display:flex;justify-content:space-between;font-size:11px;color:#374151;padding:2px 0;border-bottom:1px solid #f3f4f6}.ss-canvas-note{background:#fffbeb;border:1px solid #fde68a;padding:12px 14px;margin-bottom:16px}.ss-canvas-note-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#92400e;margin-bottom:4px}.ss-canvas-note-text{font-size:11px;color:#78350f;line-height:1.55}.ss-signature{border-top:1px solid #d1d5db;padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:11px;color:#6b7280}.ss-sig-line{border-bottom:1px solid #1e293b;height:24px;margin-bottom:4px}.ss-footer{text-align:center;font-size:9px;color:#9ca3af;border-top:1px solid #e5e7eb;padding-top:10px;margin-top:16px}.auto-badge{font-size:9px;padding:1px 5px;border-radius:3px;background:#dbeafe;color:#1d4ed8;font-weight:700}.manual-badge{font-size:9px;padding:1px 5px;border-radius:3px;background:#fef3c7;color:#92400e;font-weight:700}</style></head><body>${html}</body></html>`;
  const blob=new Blob([full],{type:'text/html'});
